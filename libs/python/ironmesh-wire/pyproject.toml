[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ironmesh-wire"
version = "0.1.0"
description = "IronMesh reference wire-format library: canonical CBOR, COSE profiles, message envelope, firmware manifest, block delta, HPKE config wrap"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "IronMesh contributors" }]
dependencies = [
  "cryptography>=42",
]

[project.optional-dependencies]
dev = [
  "cbor2>=5.6",
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
  "pyhpke>=0.5",
]
pq = [
  "pqcrypto>=0.3",
]

[project.scripts]
ironmesh-wire = "ironmesh_wire.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ironmesh_wire = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "W", "I", "UP", "B", "SIM", "RUF", "C4", "PIE", "PT", "RET", "ARG",
  "N", "PLE", "PLW", "S", "T20", "ISC", "TID", "ERA", "PERF",
]
ignore = [
  "S101",   # asserts are fine in tests and as internal invariants
  "S105",   # test key material is intentionally public
  "S106",
  "RUF012", # mutable class attributes on dataclasses handled by frozen=True
  "PLW2901",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ARG", "PLW", "E501", "RUF001", "RUF003"]
"src/ironmesh_wire/cli.py" = ["T201"]
"src/ironmesh_wire/vectors.py" = ["S311", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["ironmesh_wire"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["pqcrypto.*", "pyhpke.*"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
# B101: asserts in src only narrow types after an explicit check (kid type fixed by COSE decoding,
# body type by the message type, struct sizes at import); every security decision raises a
# WireError explicitly, so stripping asserts with -O changes nothing.
skips = ["B101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["ironmesh_wire"]
branch = false
omit = ["*/ironmesh_wire/__main__.py"]

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_also = [
  "if TYPE_CHECKING:",
  "@overload",
  "\\.\\.\\.$",
]
