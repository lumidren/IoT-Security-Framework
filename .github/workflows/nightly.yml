# Nightly: backup/restore drill, long fuzzing with corpus minimisation, a 1 000-device load
# smoke against the compose stack, and dependency drift.
name: nightly

on:
  schedule:
    - cron: "15 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  # cargo-fuzz needs nightly (sanitizers).
  FUZZ_TOOLCHAIN: nightly

jobs:
  # ------------------------------------------------------------------------------------------
  # scripts/backup/pg_backup.sh -> pg_restore_test.sh against a seeded postgres:16, with an
  # S3 + KMS API (moto server) standing in for the backup bucket.
  # ------------------------------------------------------------------------------------------
  backup-restore:
    name: backup restore drill
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ironmesh_admin
          POSTGRES_PASSWORD: admin-nightly
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ironmesh_admin" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGSSLMODE: disable
      POSTGRES_USER: ironmesh_admin
      PGPASSWORD: admin-nightly
      DB_PW: nightly-db-password
      AWS_ACCESS_KEY_ID: nightly
      AWS_SECRET_ACCESS_KEY: nightly
      AWS_REGION: eu-west-1
      AWS_ENDPOINT_URL: http://127.0.0.1:5000
      BACKUP_BUCKET: ironmesh-nightly-backups
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: client tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends postgresql-client jq
          psql --version
      - name: roles and databases (deploy/docker/postgres/10-ironmesh.sh)
        run: |
          sudo mkdir -p /run/secrets
          for db in pki registry ota anomaly; do
            printf '%s' "${DB_PW}" | sudo tee "/run/secrets/${db}_db_owner_password" "/run/secrets/${db}_db_password" >/dev/null
          done
          printf '%s' "${DB_PW}" | sudo tee /run/secrets/backup_db_password >/dev/null
          sudo chmod 0444 /run/secrets/*
          bash deploy/docker/postgres/10-ironmesh.sh
      - name: service schemas (the services' own migrations)
        run: |
          python -m pip install -q -e libs/python/ironmesh-wire -e services/registry -e services/ota -e services/anomaly
          (cd services/registry && REGISTRY_MIGRATION_DATABASE_URL="postgresql+asyncpg://registry_owner:${DB_PW}@localhost:5432/registry" alembic upgrade head)
          OTA_MIGRATION_DATABASE_URL="postgresql+asyncpg://ota_owner:${DB_PW}@localhost:5432/ota" python -m ironmesh_ota.migrate
          python -c "import asyncio, sys; from ironmesh_anomaly.pg_repository import migrate; asyncio.run(migrate(sys.argv[1]))" \
            "postgresql://anomaly_owner:${DB_PW}@localhost:5432/anomaly"
          PGUSER=pki_owner PGPASSWORD="${DB_PW}" psql -v ON_ERROR_STOP=1 -d pki -f services/pki/internal/store/postgres/migrations/0001_init.sql
      - name: seed data (registry demo seed)
        working-directory: services/registry
        env:
          REGISTRY_DB_HOST: localhost
          REGISTRY_DB_USER: registry_app
          REGISTRY_DB_PASSWORD: ${{ env.DB_PW }}
        run: python -m app.seed --tenant nightly --devices 200
      - name: S3 + KMS stand-in (moto)
        run: |
          python -m pip install -q "moto[server]"
          nohup moto_server -H 127.0.0.1 -p 5000 > moto.log 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:5000/moto-api/ >/dev/null && break; sleep 1; done
          aws s3 mb "s3://${BACKUP_BUCKET}"
          key_id="$(aws kms create-key --query KeyMetadata.KeyId --output text)"
          aws kms create-alias --alias-name alias/ironmesh-nightly-s3 --target-key-id "${key_id}"
      - name: backup (scripts/backup/pg_backup.sh)
        env:
          PGUSER: ironmesh_backup
          PGPASSWORD: ${{ env.DB_PW }}
          PG_IAM_AUTH: "false"
          BACKUP_KMS_KEY_ID: alias/ironmesh-nightly-s3
          PRUNE_ENABLED: "false"
        run: bash scripts/backup/pg_backup.sh
      - name: restore drill (scripts/backup/pg_restore_test.sh)
        env:
          RESTORE_PGHOST: localhost
          RESTORE_PGUSER: ironmesh_admin
          RESTORE_PGPASSWORD: admin-nightly
          RESTORE_PG_IAM_AUTH: "false"
        run: bash scripts/backup/pg_restore_test.sh

  # ------------------------------------------------------------------------------------------
  # Long fuzzing: 10 minutes per target, corpus minimisation, new corpus as an artifact
  # ------------------------------------------------------------------------------------------
  fuzz-long:
    name: fuzz (${{ matrix.crate }})
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        crate: [device/agent-rs, device/esp32/host]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: nightly toolchain
        run: rustup toolchain install "${FUZZ_TOOLCHAIN}" --profile minimal --component llvm-tools-preview
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-fuzz
      - name: fuzz every target for 600 s, then minimise the corpus
        working-directory: ${{ matrix.crate }}
        run: |
          status=0
          # cargo-fuzz defaults --target to the triple it was built for (the prebuilt binary is
          # musl: static libc, no sanitizer support), so build for the toolchain host instead.
          host="$(rustc "+${FUZZ_TOOLCHAIN}" -vV | sed -n 's/^host: //p')"
          for target in $(cargo "+${FUZZ_TOOLCHAIN}" fuzz list); do
            mkdir -p "fuzz/corpus/${target}"
            echo "::group::${target}"
            if ! cargo "+${FUZZ_TOOLCHAIN}" fuzz run --target "${host}" "${target}" "fuzz/corpus/${target}" -- \
                -max_total_time=600 -max_len=16384 -print_final_stats=1; then
              echo "::error::fuzz target ${target} found a crash"
              status=1
            fi
            cargo "+${FUZZ_TOOLCHAIN}" fuzz cmin --target "${host}" "${target}" "fuzz/corpus/${target}" || status=1
            echo "::endgroup::"
          done
          exit "${status}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fuzz-corpus-${{ strategy.job-index }}
          path: ${{ matrix.crate }}/fuzz/corpus/
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-crashes-${{ strategy.job-index }}
          path: ${{ matrix.crate }}/fuzz/artifacts/
          retention-days: 30

  # ------------------------------------------------------------------------------------------
  # Load smoke: compose stack + 1 000 simulated devices for 5 minutes
  # ------------------------------------------------------------------------------------------
  load-smoke:
    name: load smoke (1000 devices, 5 min)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      IRONMESH_FLEET_COUNT: "1000"
      IRONMESH_FLEET_ANOMALOUS: "0"
      IRONMESH_STACK_ONLY: "1"
      COMPOSE_FILE: deploy/docker/docker-compose.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: stack + fleet
        run: scripts/demo/quickstart.sh
      - name: wait for 1000 enrolled devices
        run: docker compose --profile tools run --rm --no-deps demo-tools wait-active 1000 --timeout-s 1200
      - name: hold load for 5 minutes
        run: sleep 300
      - name: assertions
        run: |
          docker compose --profile tools run --rm --no-deps demo-tools status | tee status.json
          restarts="$(docker inspect -f '{{.Name}} {{.RestartCount}}' $(docker compose ps -q) | awk '$2 > 0')"
          if [ -n "${restarts}" ]; then echo "::error::containers restarted under load:"; echo "${restarts}"; exit 1; fi
          errors="$(curl -sf 'http://127.0.0.1:9090/api/v1/query?query=sum(increase(ironmesh_bridge_forward_errors_total%5B5m%5D))' | jq -r '.data.result[0].value[1] // "0"')"
          echo "bridge forward errors in the last 5 min: ${errors}"
          awk -v e="${errors}" 'BEGIN { exit (e > 0) }' || { echo "::error::bridge forward errors under load"; exit 1; }
      - name: logs
        if: always()
        run: docker compose logs --no-color --timestamps > compose.log 2>&1 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: load-smoke
          path: |
            compose.log
            status.json
          retention-days: 7
      - name: tear down
        if: always()
        run: |
          docker compose --profile tools down -v --remove-orphans || true
          rm -f deploy/docker/.env

  # ------------------------------------------------------------------------------------------
  # Dependency drift: manifests vs lockfiles (fail) and available updates (report)
  # ------------------------------------------------------------------------------------------
  dependency-drift:
    name: dependency drift
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/pki/go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Go modules tidy and outdated
        run: |
          status=0
          for svc in pki policy bridge; do
            (cd "services/${svc}" && GOWORK=off go mod tidy -diff) || { echo "::error::services/${svc}: go.mod/go.sum not tidy"; status=1; }
            { echo "### services/${svc}"; echo '```'; (cd "services/${svc}" && GOWORK=off go list -m -u -f '{{if and .Update (not .Indirect)}}{{.Path}} {{.Version}} -> {{.Update.Version}}{{end}}' all); echo '```'; } >> "${GITHUB_STEP_SUMMARY}"
          done
          exit "${status}"
      - name: Cargo lockfiles in sync
        run: |
          for crate in device/agent-rs device/agent-rs/fuzz device/esp32/host device/esp32/host/fuzz; do
            (cd "${crate}" && cargo metadata --locked --format-version 1 >/dev/null) || { echo "::error::${crate}: Cargo.lock out of date"; exit 1; }
          done
      - name: npm lockfile in sync and outdated
        working-directory: console
        run: |
          npm ci --ignore-scripts --dry-run >/dev/null
          { echo "### console"; echo '```'; npm outdated || true; echo '```'; } >> "${GITHUB_STEP_SUMMARY}"
      - name: Python outdated (resolved from pyproject)
        run: |
          python -m pip install -q -e libs/python/ironmesh-wire -e services/registry -e services/ota -e services/anomaly
          { echo "### python"; echo '```'; python -m pip list --outdated --not-required || true; echo '```'; } >> "${GITHUB_STEP_SUMMARY}"
