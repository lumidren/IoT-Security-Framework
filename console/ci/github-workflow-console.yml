# Copy to .github/workflows/console.yml at the repository root.
# Lint, typecheck, unit tests, production build, Playwright + axe e2e (mock mode) and Lighthouse CI.
name: console

on:
  push:
    paths: ['console/**', '.github/workflows/console.yml']
  pull_request:
    paths: ['console/**', '.github/workflows/console.yml']

permissions:
  contents: read

defaults:
  run:
    working-directory: console

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 'true'
          NEXT_TELEMETRY_DISABLED: '1'
          AUTH_SECRET: ${{ secrets.CONSOLE_E2E_AUTH_SECRET || 'ci-only-secret-not-for-production-0123456789' }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: console/playwright-report
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npm run build:mock
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: npm run lhci
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: console/.lighthouseci
          retention-days: 7
