# Trivy secret-scanner configuration (picked up automatically from the working directory by the
# `trivy fs` steps in .github/workflows/security.yml).
#
# Same scope as the path allowlist in .gitleaks.toml: committed, intentionally public test
# material only. The keys under these paths are derived from public labels, are documented in
# libs/python/ironmesh-wire/tests/keys/README.md and are never used outside tests and vectors.
# Every other path stays subject to the secret rules.
allow-rules:
  - id: ironmesh-test-keys
    description: Fixed public test keys of the wire library
    path: ^libs/python/ironmesh-wire/tests/keys/
  - id: ironmesh-test-vectors
    description: Cross-language test vectors built from the public test keys
    path: ^device/common/vectors/[^/]+\.json$
  - id: ironmesh-test-fixtures
    description: Test fixtures
    path: (^|/)(testdata|tests/fixtures)/
  - id: ironmesh-console-mock-fixtures
    description: Console demo-mode fixtures (no real credentials)
    path: ^console/src/mocks/fixtures/
