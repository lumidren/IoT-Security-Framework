[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ironmesh-ota"
version = "0.1.0"
description = "IronMesh OTA service: firmware artifacts, hybrid manifest signing, delta patches, staged rollout campaigns"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "lumidren" }]
dependencies = [
  "ironmesh-wire>=0.1.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "python-multipart>=0.0.9",
  "boto3>=1.34",
  "structlog>=24.1",
  "prometheus-client>=0.20",
  "pyjwt[crypto]>=2.8",
  "httpx>=0.27",
  "aiokafka>=0.11",
  "aiomqtt>=2.3",
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp-proto-grpc>=1.25",
  "opentelemetry-instrumentation-fastapi>=0.46b0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "moto[s3,kms,secretsmanager]>=5",
  "pgserver>=0.1.4",
  "ruff>=0.5",
  "mypy>=1.10",
  "bandit>=1.7",
  "boto3-stubs[s3,kms,secretsmanager]",
]

[project.scripts]
ironmesh-ota = "ironmesh_ota.__main__:main"
ironmesh-ota-keytool = "ironmesh_ota.keytool:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ironmesh_ota = ["py.typed", "migrations/*.py", "migrations/*.mako", "migrations/versions/*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "W", "I", "UP", "B", "SIM", "RUF", "C4", "PIE", "PT", "RET", "ARG",
  "N", "PLE", "PLW", "S", "T20", "ISC", "TID", "ERA", "PERF", "ASYNC", "DTZ",
]
ignore = [
  "S101",   # internal invariants
  "B008",   # FastAPI Depends() in defaults is the framework idiom
  "TID252", # intra-package relative imports are deliberate
  "N818",   # domain exception names (ArtifactConflict, ReplayRejected) read better
  "ARG002", # protocol implementations keep the full signature
  "RUF012",
  "PLW2901",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ARG", "PLW", "E501", "DTZ", "ASYNC", "PT018", "PT011", "RUF005", "RUF059", "PT012"]
"src/ironmesh_ota/keytool.py" = ["T201"]
"src/ironmesh_ota/migrations/**" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ironmesh_ota", "ironmesh_wire"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["aiokafka.*", "pgserver.*", "moto.*", "python_multipart.*", "paho.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "postgres: needs a PostgreSQL server (pgserver locally or OTA_TEST_DATABASE_URL in CI)",
]
filterwarnings = [
  "error",
  "ignore::DeprecationWarning:botocore.*",
  "ignore::DeprecationWarning:moto.*",
  "ignore::ResourceWarning",
]

[tool.coverage.run]
source = ["ironmesh_ota"]
branch = true
omit = ["*/ironmesh_ota/migrations/*", "*/ironmesh_ota/__main__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "@overload",
  "\\.\\.\\.$",
  "raise NotImplementedError",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
