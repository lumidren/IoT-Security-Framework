# Alembic CLI config for the OTA schema. The URL is taken from OTA_MIGRATION_DATABASE_URL (an
# owner role - never ota_app). Programmatic runs use `python -m ironmesh_ota.migrate`.
[alembic]
script_location = src/ironmesh_ota/migrations

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
