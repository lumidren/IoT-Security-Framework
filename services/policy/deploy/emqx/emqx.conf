## IronMesh EMQX 5 broker configuration (HOCON).
##
## Implements DESIGN_CONTRACT.md section 4 (MQTT) and section 7 (services): one mTLS-only MQTT 5
## listener on 8883, TLS 1.3 only, client certificates mandatory, username taken from the client
## certificate CN, and every authentication / authorization decision delegated to the IronMesh
## policy service over HTTP. Nothing is allowed unless the policy service says so.
##
## Validate against your EMQX release before deploying (`emqx ctl conf check` or a dry start):
## the schema is version-specific. Keys to double-check are marked "VERIFY".

node {
  name = "emqx@127.0.0.1"
  cookie = "replace-me-with-a-random-cookie"
  data_dir = "data"
}

cluster {
  name = ironmesh
  discovery_strategy = manual
}

log.console {
  enable = true
  level = info
  formatter = json
}

## ---------------------------------------------------------------------------------------------
## Listeners: only the mTLS listener is enabled.
## ---------------------------------------------------------------------------------------------

listeners.tcp.default { enable = false }
listeners.ws.default  { enable = false }
listeners.wss.default { enable = false }

listeners.ssl.default {
  bind = "0.0.0.0:8883"
  max_connections = 1024000
  access_rules = ["allow all"]

  ssl_options {
    ## Device CA + Services CA (and the offline Root) so both device and service certs verify.
    cacertfile = "/opt/emqx/etc/certs/ironmesh-ca-chain.pem"
    ## Broker certificate issued by the Services CA; SAN must match the host devices pin.
    certfile = "/opt/emqx/etc/certs/broker.pem"
    keyfile  = "/opt/emqx/etc/certs/broker.key"

    ## Mutual TLS is mandatory: no certificate, no connection.
    verify = verify_peer
    fail_if_no_peer_cert = true

    ## TLS 1.3 only (TLS 1.2 and below are rejected).
    versions = [tlsv1.3]
    depth = 3

    ## ALPN: the EMQX 5.8 listener schema has no ALPN option (the Erlang ssl option is not
    ## exposed), so the broker does not negotiate "mqtt". Devices still offer it; an L4 proxy or
    ## ingress in front of EMQX can enforce it (THREAT_MODEL "ALPN" row).

    ## Revocation is enforced by the policy service at CONNECT time: device-level denies (PKI
    ## revoke-all) by device id and serial revocations (PKI push + CRL poll) by the serial of the
    ## presented certificate (cert_pem / cert_serial in the authn body). Live sessions are kicked
    ## through the management API; the TLS-layer CRL check stays off.
    enable_crl_check = false
    hibernate_after = 5s
  }
}

## ---------------------------------------------------------------------------------------------
## MQTT protocol settings (contract section 4 "Session").
## ---------------------------------------------------------------------------------------------

mqtt {
  max_packet_size = 64KB
  max_qos_allowed = 1
  retain_available = true
  ## Wildcards and shared subscriptions are permitted at the protocol level; the policy service
  ## decides who may actually use them (devices: never; svc-bridge: $share/bridge/im/v1/#).
  wildcard_subscription = true
  shared_subscription = true
  exclusive_subscription = false
  session_expiry_interval = 7d
  max_inflight = 32
  max_topic_levels = 8
  keepalive_multiplier = 1.5

  ## Username = certificate CN. The client id is chosen by the device and MUST equal the CN; the
  ## policy authn hook rejects any mismatch, so peer_cert_as_clientid stays disabled on purpose.
  peer_cert_as_username = cn
  peer_cert_as_clientid = disabled
  use_username_as_clientid = false

  ## Fallback source of the certificate serial for the authn hook (cert_serial =
  ## "${client_attrs.cert_serial}"), only needed if ${cert_pem} is not rendered in HTTP authn
  ## bodies (see the authentication block).
  ## VERIFY before enabling: that the client_attrs_init expression language of the deployed
  ## 5.8.x release exposes the TLS client certificate serial; the variable name below is a
  ## placeholder. The expression MUST be derived from the TLS peer certificate only - never from
  ## clientid, username, password or user_property, which the client controls and could use to
  ## present a non-revoked serial.
  # client_attrs_init = [
  #   { expression = "<certificate serial variable, e.g. cert_serial>", set_as_attr = "cert_serial" }
  # ]
}

## ---------------------------------------------------------------------------------------------
## Authentication: HTTP backend -> policy service.
## ---------------------------------------------------------------------------------------------

authentication = [
  {
    mechanism = password_based
    backend = http
    enable = true
    method = post
    url = "http://policy:8081/emqx/authn"
    headers {
      "content-type" = "application/json"
      ## Optional shared secret; must equal POLICY_HOOK_TOKEN on the policy service.
      "x-ironmesh-hook-token" = "replace-with-POLICY_HOOK_TOKEN"
    }
    body {
      clientid = "${clientid}"
      username = "${username}"
      peerhost = "${peerhost}"
      cert_common_name = "${cert_common_name}"
      cert_subject = "${cert_subject}"
      ## Serial revocation at CONNECT (THREAT_MODEL T-13, T-37). The policy service parses the
      ## client certificate, checks its issuer (POLICY_DEVICE_CA_FILE / POLICY_SERVICES_CA_FILE)
      ## and denies a revoked serial (reason revoked_serial). With POLICY_REQUIRE_CERT_SERIAL=true
      ## (default) a CONNECT whose body carries neither a usable cert_pem nor cert_serial is DENIED
      ## (reason no_cert_serial); unrendered placeholders count as absent.
      ##
      ## VERIFY (not confirmed against the 5.8 docs while writing this file): that the deployed
      ## EMQX 5.8.x release renders ${cert_pem} in HTTP authn bodies as the PEM of the client
      ## certificate. Check before rollout: connect a device and confirm the policy log/metric
      ## ironmesh_auth_failures_total{reason="no_cert_serial"} stays at 0. If it does not render,
      ## enable the client_attrs_init extraction (mqtt block, also VERIFY) or, as a temporary measure
      ## only, set POLICY_REQUIRE_CERT_SERIAL=false (serial revocations then do not apply).
      cert_pem = "${cert_pem}"
      ## Fallback: serial set by mqtt.client_attrs_init (see the "mqtt" block). Harmless when the
      ## attribute is not initialised (rendered empty -> ignored when cert_pem is present).
      cert_serial = "${client_attrs.cert_serial}"
    }
    connect_timeout = 2s
    request_timeout = 2s
    pool_size = 16
    enable_pipelining = 100
    ssl { enable = false }
  }
]

## ---------------------------------------------------------------------------------------------
## Authorization: HTTP backend -> policy service, deny by default, disconnect on deny.
## ---------------------------------------------------------------------------------------------

authorization {
  no_match = deny
  deny_action = disconnect
  cache {
    enable = true
    max_size = 32
    ttl = 10s
  }
  sources = [
    {
      type = http
      enable = true
      method = post
      url = "http://policy:8081/emqx/authz"
      headers {
        "content-type" = "application/json"
        "x-ironmesh-hook-token" = "replace-with-POLICY_HOOK_TOKEN"
      }
      body {
        clientid = "${clientid}"
        username = "${username}"
        peerhost = "${peerhost}"
        topic = "${topic}"
        action = "${action}"
        qos = "${qos}"
        retain = "${retain}"
        ## Session attributes set by the authn response (EMQX >= 5.7). The body template only
        ## takes string values, so they are sent flat; the policy service accepts both forms.
        tenant_id = "${client_attrs.tenant_id}"
        device_id = "${client_attrs.device_id}"
        kind = "${client_attrs.kind}"
      }
      connect_timeout = 2s
      request_timeout = 2s
      pool_size = 16
      enable_pipelining = 100
      ssl { enable = false }
    },
    {
      ## Fallback: deny everything that the HTTP source could not decide.
      type = file
      enable = true
      path = "etc/acl.conf"
    }
  ]
}

## ---------------------------------------------------------------------------------------------
## Auth event webhook -> bridge (POST http://bridge:8082/emqx/events -> Redpanda im.auth).
##
## EMQX 5.8 schema: an HTTP connector (base URL), an HTTP action (path, method, headers) and a
## rule-engine rule that selects the four client events. The action has no body template, so EMQX
## posts every field the rule selects as one JSON object per event, which is exactly what the
## bridge handler decodes (services/bridge/internal/bridge/events.go): event, clientid, username,
## peername / peerhost, reason, reason_code, topic, action, result, timestamp (ms), node and
## client_attrs. The bridge maps client.connected / client.disconnected to connected /
## disconnected, client.check_authn_complete with reason_code != success to authn_failed and
## client.check_authz_complete with result = deny to authz_denied; the WHERE clause drops the
## successful authn/authz completions before they leave the broker.
##
## The bridge authenticates the webhook with X-IronMesh-Hook-Token, which must equal
## BRIDGE_EVENTS_TOKEN. Override the placeholder at deploy time, e.g. in compose:
##   EMQX_ACTIONS__HTTP__IRONMESH_AUTH_EVENTS__PARAMETERS__HEADERS__X-IRONMESH-HOOK-TOKEN
## A 503 from the bridge (Kafka unavailable) is retried by the action (max_retries, buffer).
## VERIFY: run `emqx ctl conf check` / a dry start against the deployed 5.8.x release.
## ---------------------------------------------------------------------------------------------

connectors {
  http {
    ironmesh_bridge {
      enable = true
      url = "http://bridge:8082"
      connect_timeout = 5s
      pool_type = random
      pool_size = 8
      enable_pipelining = 100
      headers {
        "content-type" = "application/json"
      }
      ssl { enable = false }
      resource_opts {
        health_check_interval = 15s
        start_timeout = 5s
      }
    }
  }
}

actions {
  http {
    ironmesh_auth_events {
      enable = true
      connector = ironmesh_bridge
      parameters {
        path = "/emqx/events"
        method = post
        headers {
          "content-type" = "application/json"
          ## Must equal BRIDGE_EVENTS_TOKEN on the bridge.
          "x-ironmesh-hook-token" = "replace-with-BRIDGE_EVENTS_TOKEN"
        }
        ## No body template: the selected event map is sent as JSON.
        max_retries = 3
      }
      resource_opts {
        query_mode = async
        request_ttl = 45s
        inflight_window = 100
        worker_pool_size = 4
        max_buffer_bytes = 256MB
        health_check_interval = 15s
      }
    }
  }
}

rule_engine {
  rules {
    ironmesh_auth_events {
      enable = true
      description = "IronMesh: connect/disconnect, authn failures and authz denials -> bridge -> im.auth"
      sql = """
        SELECT *
        FROM "$events/client_connected", "$events/client_disconnected",
             "$events/client_check_authn_complete", "$events/client_check_authz_complete"
        WHERE event = 'client.connected'
           OR event = 'client.disconnected'
           OR (event = 'client.check_authn_complete' AND reason_code != 'success')
           OR (event = 'client.check_authz_complete' AND result = 'deny')
      """
      actions = ["http:ironmesh_auth_events"]
    }
  }
}

## ---------------------------------------------------------------------------------------------
## Misc
## ---------------------------------------------------------------------------------------------

retainer {
  enable = true
}

sys_topics {
  ## $SYS traffic is not exposed to clients (denied by policy); keep broker noise low.
  sys_msg_interval = disabled
  sys_heartbeat_interval = disabled
}

## Management API used by the policy service to kick revoked sessions
## (DELETE /api/v5/clients/{clientid} with an API key created via api_key.bootstrap_file).
dashboard {
  listeners.http.bind = 18083
}

api_key {
  bootstrap_file = "/opt/emqx/etc/api-keys.txt"
}
