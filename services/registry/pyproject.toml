[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ironmesh-registry"
version = "0.1.0"
description = "IronMesh Device Registry & Fleet Service"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "IronMesh contributors" }]
dependencies = [
  "ironmesh-wire>=0.1.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.30,<2.2",  # OTel instrumentation supports < 2.1
  "asyncpg>=0.29",
  "alembic>=1.13",
  "aiokafka>=0.11",
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp-proto-grpc>=1.25",
  "opentelemetry-instrumentation-fastapi>=0.46b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.46b0",
  "prometheus-client>=0.20",
  "structlog>=24.1",
  "httpx>=0.27",
  "paho-mqtt>=2.1",
  "boto3>=1.34",
  "pyjwt[crypto]>=2.8",
  "cryptography>=42",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
  "bandit>=1.7",
  "pgserver>=0.1.4",
  "httpx-ws>=0.7",
  "boto3-stubs[kms]>=1.34",
]

[project.scripts]
ironmesh-registry-seed = "app.seed:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
  "E", "F", "W", "I", "UP", "B", "SIM", "RUF", "C4", "PIE", "PT", "RET", "ARG",
  "N", "PLE", "PLW", "S", "T20", "ISC", "PERF", "ASYNC",
]
ignore = [
  "S101",    # asserts as internal invariants
  "RUF012",
  "PLW2901",
  "B008",    # FastAPI Depends() in defaults is the framework idiom
  "ARG002",  # protocol implementations keep the full signature
  "N818",
  "PERF401",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ARG", "PLW", "E501", "PT011", "PT018", "RUF001", "PERF", "ASYNC109", "ASYNC240", "B017", "PT012", "C408"]
"app/seed.py" = ["T201", "S311"]
"migrations/**" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["app", "tests", "migrations"]
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["aiokafka.*", "pgserver.*", "paho.*", "boto3.*", "botocore.*", "aws_msk_iam_sasl_signer.*", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
  "postgres: needs a PostgreSQL 16 server (pgserver locally or REGISTRY_TEST_DATABASE_URL in CI)",
]
filterwarnings = [
  "ignore::DeprecationWarning:opentelemetry.*",
]

[tool.coverage.run]
source = ["app"]
branch = false
omit = ["app/__main__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "@overload",
  "\\.\\.\\.$",
  "raise NotImplementedError",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "migrations"]
skips = ["B101"]  # asserts are mypy type-narrowing invariants, never security checks
