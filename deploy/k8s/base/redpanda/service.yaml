apiVersion: v1
kind: Service
metadata:
  name: redpanda
  namespace: ironmesh
  labels:
    app.kubernetes.io/name: redpanda
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: redpanda
  ports:
    - name: kafka
      port: 9092
      targetPort: kafka
      protocol: TCP
    - name: admin
      port: 9644
      targetPort: admin
      protocol: TCP
    - name: rpc
      port: 33145
      targetPort: rpc
      protocol: TCP
