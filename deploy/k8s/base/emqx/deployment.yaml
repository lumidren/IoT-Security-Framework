apiVersion: apps/v1
kind: Deployment
metadata:
  name: emqx
  namespace: ironmesh
  labels:
    app.kubernetes.io/name: emqx
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: emqx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: emqx
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "18083"
        prometheus.io/path: /api/v5/prometheus/stats
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: emqx
          image: emqx/emqx:5.8.9
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            # EMQX rewrites files under /opt/emqx/etc and /opt/emqx/data at boot.
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: emqx-config
            - secretRef:
                # EMQX_DASHBOARD__DEFAULT_PASSWORD and the X-IronMesh-Hook-Token headers.
                name: emqx-env
          ports:
            - name: mqttssl
              containerPort: 8883
              protocol: TCP
            - name: dashboard
              containerPort: 18083
              protocol: TCP
          startupProbe:
            httpGet:
              path: /status
              port: dashboard
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /status
              port: dashboard
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /status
              port: dashboard
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /opt/emqx/data
            - name: log
              mountPath: /opt/emqx/log
            - name: tls
              mountPath: /etc/ironmesh/tls
              readOnly: true
            - name: device-ca
              mountPath: /etc/ironmesh/device-ca
              readOnly: true
            - name: api-keys
              mountPath: /etc/ironmesh/emqx-api-keys
              readOnly: true
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 1Gi
        - name: log
          emptyDir:
            sizeLimit: 256Mi
        - name: tls
          secret:
            secretName: emqx-tls
            defaultMode: 0440
        - name: device-ca
          secret:
            secretName: ironmesh-dev-device-ca
            items:
              - key: tls.crt
                path: tls.crt
        - name: api-keys
          secret:
            secretName: emqx-api-keys
            defaultMode: 0440
