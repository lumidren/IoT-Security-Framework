# Service identities issued by the dev Services CA (90 d, ECDSA P-256), mounted at
# /etc/ironmesh/tls as tls.crt / tls.key / ca.crt. CN svc-<name> matches the contract
# (the bridge authenticates to the broker as CN svc-bridge).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: emqx-tls
  namespace: ironmesh
spec:
  secretName: emqx-tls
  commonName: svc-emqx
  subject:
    organizations:
      - IronMesh
    organizationalUnits:
      - services
  duration: 2160h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - digital signature
    - key encipherment
    - server auth
    - client auth
  dnsNames:
    - emqx
    - emqx.ironmesh
    - emqx.ironmesh.svc
    - emqx.ironmesh.svc.cluster.local
    # Internal service listener 8884 (BRIDGE_MQTT_URL, REGISTRY_MQTT_HOST).
    - emqx-internal
    - emqx-internal.ironmesh.svc
    - localhost
    - mqtt.ironmesh.local
  issuerRef:
    name: ironmesh-services-ca
    kind: Issuer
    group: cert-manager.io
---
