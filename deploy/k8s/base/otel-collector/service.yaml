apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: ironmesh
  labels:
    app.kubernetes.io/name: opentelemetry-collector
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: opentelemetry-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
      protocol: TCP
    - name: prom-exporter
      port: 8889
      targetPort: prom-exporter
      protocol: TCP
    - name: self-metrics
      port: 8888
      targetPort: self-metrics
      protocol: TCP
