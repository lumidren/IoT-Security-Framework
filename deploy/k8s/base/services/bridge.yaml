apiVersion: v1
kind: ConfigMap
metadata:
  name: bridge-config
  namespace: ironmesh
  labels:
    app.kubernetes.io/name: bridge
data:
  # Names and defaults from services/bridge/internal/config/config.go.
  BRIDGE_LISTEN: ":8082"
  # EMQX internal service listener (Services CA only, no per-client device rate limit).
  BRIDGE_MQTT_URL: ssl://emqx-internal:8884
  BRIDGE_MQTT_CLIENT_ID: svc-bridge
  BRIDGE_MQTT_TOPIC: $share/bridge/im/v1/#
  BRIDGE_MQTT_KEEPALIVE: 60s
  BRIDGE_MQTT_SESSION_EXPIRY: 168h
  BRIDGE_TLS_CERT_FILE: /etc/ironmesh/tls/tls.crt
  BRIDGE_TLS_KEY_FILE: /etc/ironmesh/tls/tls.key
  BRIDGE_TLS_CA_FILE: /etc/ironmesh/tls/ca.crt
  BRIDGE_TLS_SERVER_NAME: emqx
  BRIDGE_KAFKA_BROKERS: redpanda:9092
  BRIDGE_KAFKA_INGEST_TOPIC: im.ingest
  BRIDGE_KAFKA_AUTH_TOPIC: im.auth
  BRIDGE_KAFKA_TLS_ENABLED: "false"
  # SCRAM user `bridge` (redpanda-init Job); password BRIDGE_KAFKA_SASL_PASSWORD in bridge-secret.
  BRIDGE_KAFKA_SASL_MECHANISM: scram-sha-512
  BRIDGE_KAFKA_SASL_USERNAME: bridge
  # The bridge creates im.ingest, im.auth, im.alerts, im.audit, im.commands and im.campaigns on
  # boot (single Redpanda node: replication 1).
  BRIDGE_KAFKA_TOPICS_CREATE: "true"
  BRIDGE_KAFKA_TOPIC_PARTITIONS: "3"
  BRIDGE_KAFKA_TOPIC_REPLICATION: "1"
  BRIDGE_MAX_INFLIGHT: "1024"
  BRIDGE_LOG_LEVEL: debug
  OTEL_SERVICE_NAME: ironmesh-bridge
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_RESOURCE_ATTRIBUTES: service.namespace=ironmesh,deployment.environment=dev
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bridge
  namespace: ironmesh
  labels:
    app.kubernetes.io/name: bridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bridge
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bridge
          image: ghcr.io/lumidren/ironmesh-bridge:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: bridge-config
            - secretRef:
                name: bridge-secret
          ports:
            - name: http
              containerPort: 8082
              protocol: TCP
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: tls
              mountPath: /etc/ironmesh/tls
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: tls
          secret:
            secretName: bridge-tls
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: bridge
  namespace: ironmesh
  labels:
    app.kubernetes.io/name: bridge
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: bridge
  ports:
    - name: http
      port: 8082
      targetPort: http
      protocol: TCP
