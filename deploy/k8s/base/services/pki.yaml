apiVersion: v1
kind: ConfigMap
metadata:
  name: pki-config
  namespace: ironmesh
  labels:
    app.kubernetes.io/name: pki
data:
  # Names and defaults from services/pki/internal/config/config.go.
  PKI_ENV: development
  PKI_LISTEN_MTLS: ":8443"
  PKI_LISTEN_PLAIN: ":8444"
  # File KMS (development only): CA certificates, *.key.json and bundle.key.json in the pkictl
  # layout, from the ironmesh-dev-pki-ca Secret (see deploy/k8s/README.md "Dev PKI").
  PKI_KMS: file
  PKI_CA_DIR: /etc/ironmesh/ca
  PKI_BUNDLE_KEY_FILE: /etc/ironmesh/ca/bundle.key.json
  PKI_PUBLIC_BASE_URL: https://pki.ironmesh.local
  # Headless Service policy-headless: the durable revocation outbox resolves every policy pod
  # and delivers each revocation to all of them (PKI_POLICY_FANOUT=dns).
  PKI_POLICY_URL: http://policy-headless:8081
  PKI_POLICY_FANOUT: dns
  # Lifecycle checks + synchronous enrolled callback (bearer PKI_REGISTRY_TOKEN in pki-secret).
  PKI_REGISTRY_URL: http://registry:8000
  PKI_NONCE_TTL: 120s
  PKI_OPERATIONAL_CERT_TTL: 336h
  PKI_SERVER_CERT_FILE: /etc/ironmesh/tls/tls.crt
  PKI_SERVER_KEY_FILE: /etc/ironmesh/tls/tls.key
  # Tenant-policy writes are authorized by field owner on top of this list: svc-registry
  # (command key, enrollment), svc-ota (firmware keys).
  PKI_MGMT_ALLOWED_CNS: svc-registry,svc-policy,svc-console,svc-anomaly,svc-ota
  PKI_DEFAULT_ALLOW_SOFTWARE_KEYS: "true"
  PKI_BROKER_HOST: mqtt.ironmesh.local
  PKI_BROKER_PORT: "8883"
  PKI_LOG_LEVEL: debug
  OTEL_SERVICE_NAME: ironmesh-pki
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_RESOURCE_ATTRIBUTES: service.namespace=ironmesh,deployment.environment=dev
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pki
  namespace: ironmesh
  labels:
    app.kubernetes.io/name: pki
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pki
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pki
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8444"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pki
          image: ghcr.io/lumidren/ironmesh-pki:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: pki-config
            - secretRef:
                name: pki-secret
          ports:
            - name: mtls
              containerPort: 8443
              protocol: TCP
            - name: plain
              containerPort: 8444
              protocol: TCP
          startupProbe:
            httpGet:
              path: /readyz
              port: plain
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: plain
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: plain
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: state
              mountPath: /var/lib/ironmesh/pki
            - name: tls
              mountPath: /etc/ironmesh/tls
              readOnly: true
            - name: ca
              mountPath: /etc/ironmesh/ca
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: state
          emptyDir:
            sizeLimit: 256Mi
        - name: tls
          secret:
            secretName: pki-tls
            defaultMode: 0440
        # pkictl layout (root-ca.crt, factory-ca.crt, device-ca.crt, services-ca.crt,
        # device-ca.key.json, services-ca.key.json, bundle.key.json); created from a pkictl dev
        # hierarchy, see deploy/k8s/README.md "Dev PKI".
        - name: ca
          secret:
            secretName: ironmesh-dev-pki-ca
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: pki
  namespace: ironmesh
  labels:
    app.kubernetes.io/name: pki
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pki
  ports:
    - name: mtls
      port: 8443
      targetPort: mtls
      protocol: TCP
    - name: plain
      port: 8444
      targetPort: plain
      protocol: TCP
