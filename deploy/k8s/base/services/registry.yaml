apiVersion: v1
kind: ConfigMap
metadata:
  name: registry-config
  namespace: ironmesh
  labels:
    app.kubernetes.io/name: registry
data:
  # Names and defaults from services/registry/app/settings.py.
  REGISTRY_ENVIRONMENT: dev
  REGISTRY_LISTEN_PORT: "8000"
  REGISTRY_DB_HOST: postgres
  REGISTRY_DB_PORT: "5432"
  REGISTRY_DB_NAME: registry
  REGISTRY_DB_USER: registry_app
  REGISTRY_DB_SSLMODE: verify-ca
  REGISTRY_DB_IAM_AUTH: "false"
  REGISTRY_KAFKA_BROKERS: redpanda:9092
  REGISTRY_KAFKA_TOPIC_INGEST: im.ingest
  REGISTRY_KAFKA_TOPIC_AUTH: im.auth
  REGISTRY_KAFKA_TOPIC_ALERTS: im.alerts
  REGISTRY_KAFKA_TOPIC_AUDIT: im.audit
  REGISTRY_KAFKA_TOPIC_COMMANDS: im.commands
  REGISTRY_KAFKA_TOPIC_CAMPAIGNS: im.campaigns
  REGISTRY_KAFKA_CONSUMER_GROUP: registry-ingest
  # SCRAM user `registry` (redpanda-init Job); password REGISTRY_KAFKA_SASL_PASSWORD in
  # registry-secret. The registry matches the mechanism case-sensitively.
  REGISTRY_KAFKA_SASL_MECHANISM: SCRAM-SHA-512
  REGISTRY_KAFKA_SASL_USERNAME: registry
  REGISTRY_KAFKA_TLS_ENABLED: "false"
  # PKI management API over mTLS (registry-tls, CN svc-registry): the registry is the only
  # holder of tenant command keys and pushes the public key + enrollment flag to the PKI.
  REGISTRY_PKI_URL: https://pki:8443
  REGISTRY_POLICY_URL: http://policy:8081
  REGISTRY_OTA_URL: http://ota:8001
  REGISTRY_EMQX_API_URL: http://emqx-api:18083
  # No IdP in the dev stack: point this at your Dex/Keycloak before enabling OIDC-protected routes.
  REGISTRY_OIDC_ISSUER: ""
  REGISTRY_OIDC_AUDIENCE: ironmesh-api
  REGISTRY_PUBLIC_BASE_URL: https://registry.ironmesh.local
  REGISTRY_TLS_CERT_FILE: /etc/ironmesh/tls/tls.crt
  REGISTRY_TLS_KEY_FILE: /etc/ironmesh/tls/tls.key
  REGISTRY_TLS_CA_FILE: /etc/ironmesh/tls/ca.crt
  REGISTRY_SERVICE_JWT_PRIVATE_KEY_FILE: /etc/ironmesh/tls/tls.key
  # Downlink publisher (MQTT 5, mTLS with the registry-tls identity) on the EMQX internal service
  # listener (the device listener's per-client rate limit would throttle fleet-wide downlinks).
  REGISTRY_MQTT_HOST: emqx-internal
  REGISTRY_MQTT_PORT: "8884"
  REGISTRY_MQTT_CLIENT_ID: svc-registry
  # Dev only: the KEK lives on the pod's emptyDir and is lost with it.
  REGISTRY_KMS_BACKEND: local
  REGISTRY_KMS_LOCAL_KEK_FILE: /tmp/registry-kek.bin
  REGISTRY_LOG_LEVEL: debug
  REGISTRY_LOG_FORMAT: json
  OTEL_SERVICE_NAME: ironmesh-registry
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_RESOURCE_ATTRIBUTES: service.namespace=ironmesh,deployment.environment=dev
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: ironmesh
  labels:
    app.kubernetes.io/name: registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: registry
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: registry
          image: ghcr.io/lumidren/ironmesh-registry:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: registry-config
            - secretRef:
                name: registry-secret
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: tls
              mountPath: /etc/ironmesh/tls
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: tls
          secret:
            secretName: registry-tls
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: ironmesh
  labels:
    app.kubernetes.io/name: registry
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: registry
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
---
# Schema migrations as the schema owner (registry-secret). Idempotent; finished Jobs are garbage-collected
# after ttlSecondsAfterFinished, so the next `kubectl apply -k` re-runs them (a Job's pod template
# is immutable: delete the Job first if it still exists after an image change).
apiVersion: batch/v1
kind: Job
metadata:
  name: registry-migrate
  namespace: ironmesh
  labels:
    app.kubernetes.io/name: registry-migrate
    app.kubernetes.io/component: migrate
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: registry-migrate
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/lumidren/ironmesh-registry:latest
          imagePullPolicy: IfNotPresent
          workingDir: /srv
          command: ["alembic", "-c", "/srv/alembic.ini", "upgrade", "head"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          envFrom:
            - secretRef:
                name: registry-secret
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
