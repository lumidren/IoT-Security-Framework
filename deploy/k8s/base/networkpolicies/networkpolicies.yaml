            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [emqx, pki, registry, anomaly, console]
      ports:
        - protocol: TCP
          port: 8081
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: emqx
      ports:
        - protocol: TCP
          port: 18083
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: pki
      ports:
        - protocol: TCP
          port: 8444
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: registry
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redpanda
      ports:
        - protocol: TCP
          port: 9092
