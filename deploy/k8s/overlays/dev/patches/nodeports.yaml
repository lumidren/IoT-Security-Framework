apiVersion: v1
kind: Service
metadata:
  name: console
  namespace: ironmesh
spec:
  type: NodePort
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30300
---
apiVersion: v1
kind: Service
metadata:
  name: emqx
  namespace: ironmesh
spec:
  type: NodePort
  ports:
    # Devices only. The management API / dashboard (Service emqx-api) and the internal service
    # listener (Service emqx-internal) are never NodePorts (T-76); for local debugging use
    # `kubectl -n ironmesh port-forward svc/emqx-api 18083:18083`.
    - name: mqttssl
      port: 8883
      targetPort: mqttssl
      nodePort: 30883
---
apiVersion: v1
kind: Service
metadata:
  name: pki
  namespace: ironmesh
spec:
  type: NodePort
  ports:
    - name: mtls
      port: 8443
      targetPort: mtls
      nodePort: 30443
    - name: plain
      port: 8444
      targetPort: plain
      nodePort: 30444
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: ironmesh
spec:
  type: NodePort
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 30800
