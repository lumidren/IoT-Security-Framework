apiVersion: v1
kind: Service
metadata:
  name: console
  namespace: ironmesh
spec:
  type: NodePort
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30300
---
apiVersion: v1
kind: Service
metadata:
  name: emqx
  namespace: ironmesh
spec:
  type: NodePort
  ports:
    - name: mqttssl
      port: 8883
      targetPort: mqttssl
      nodePort: 30883
    - name: dashboard
      port: 18083
      targetPort: dashboard
      nodePort: 31883
---
apiVersion: v1
kind: Service
metadata:
  name: pki
  namespace: ironmesh
spec:
  type: NodePort
  ports:
    - name: mtls
      port: 8443
      targetPort: mtls
      nodePort: 30443
    - name: plain
      port: 8444
      targetPort: plain
      nodePort: 30444
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: ironmesh
spec:
  type: NodePort
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 30800
