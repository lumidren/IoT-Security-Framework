apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# kind / minikube developer overlay:
#   kind create cluster --config deploy/k8s/kind-config.yaml
#   kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.21.3/cert-manager.yaml
#   kubectl apply -k deploy/k8s/overlays/dev
#
# Every value in secretGenerator below is a development credential for a throw-away cluster.

namespace: ironmesh

resources:
  - ../../base

images:
  - name: ghcr.io/lumidren/ironmesh-pki
    newTag: dev
  - name: ghcr.io/lumidren/ironmesh-policy
    newTag: dev
  - name: ghcr.io/lumidren/ironmesh-bridge
    newTag: dev
  - name: ghcr.io/lumidren/ironmesh-registry
    newTag: dev
  - name: ghcr.io/lumidren/ironmesh-ota
    newTag: dev
  - name: ghcr.io/lumidren/ironmesh-anomaly
    newTag: dev
  - name: ghcr.io/lumidren/ironmesh-console
    newTag: dev

generatorOptions:
  disableNameSuffixHash: true
  labels:
    ironmesh.dev/dev-credential: "true"

secretGenerator:
  - name: postgres-admin
    literals:
      - username=ironmesh_admin
      - password=ironmesh-dev-admin
  - name: dev-db
    literals:
      - IRONMESH_DEV_DB_PASSWORD=ironmesh-dev
  - name: pki-secret
    literals:
      # Runtime role pki_app (NOBYPASSRLS, forced RLS applies); the embedded migrations run at
      # start as the schema owner pki_owner.
      - PKI_DATABASE_URL=postgres://pki_app:ironmesh-dev@postgres:5432/pki?sslmode=verify-ca&sslrootcert=/etc/ironmesh/tls/ca.crt
      - PKI_MIGRATION_DATABASE_URL=postgres://pki_owner:ironmesh-dev@postgres:5432/pki?sslmode=verify-ca&sslrootcert=/etc/ironmesh/tls/ca.crt
      - PKI_POLICY_TOKEN=dev-pki-policy-token
      - PKI_POLICY_HMAC_KEY=dev-pki-policy-hmac
      - PKI_REGISTRY_TOKEN=dev-registry-token-pki
      - PKI_FILE_KMS_PASSPHRASE=dev-file-kms-passphrase
  - name: policy-secret
    literals:
      - POLICY_EMQX_API_KEY=policy
      - POLICY_EMQX_API_SECRET=dev-emqx-policy-secret
      - POLICY_PKI_HMAC_SECRET=dev-pki-policy-hmac
      - POLICY_PKI_TOKEN=dev-pki-policy-token
      - POLICY_REGISTRY_TOKEN=dev-registry-token-policy
      - POLICY_HOOK_TOKEN=dev-emqx-hook-token
  - name: bridge-secret
    literals:
      # = the EMQX webhook action header in emqx-env below.
      - BRIDGE_EVENTS_TOKEN=dev-bridge-events-token
      # SCRAM user `bridge` (= KAFKA_BRIDGE_PASSWORD in redpanda-users).
      - BRIDGE_KAFKA_SASL_PASSWORD=dev-kafka-bridge
  - name: registry-secret
    literals:
      - REGISTRY_DB_PASSWORD=ironmesh-dev
      # One distinct token per caller (pki, policy, anomaly, ota); must equal PKI_REGISTRY_TOKEN,
      # POLICY_REGISTRY_TOKEN, ANOMALY_INTERNAL_TOKEN and OTA_REGISTRY_TOKEN.
      - 'REGISTRY_INTERNAL_TOKENS={"pki": "dev-registry-token-pki", "policy": "dev-registry-token-policy", "anomaly": "dev-registry-token-anomaly", "ota": "dev-registry-token-ota"}'
      - REGISTRY_EMQX_API_KEY=registry
      - REGISTRY_EMQX_API_SECRET=dev-emqx-registry-secret
      # SCRAM user `registry` (= KAFKA_REGISTRY_PASSWORD in redpanda-users).
      - REGISTRY_KAFKA_SASL_PASSWORD=dev-kafka-registry
      # Schema owner for the registry-migrate Job (alembic upgrade head).
      - REGISTRY_MIGRATION_DATABASE_URL=postgresql+asyncpg://registry_owner:ironmesh-dev@postgres:5432/registry?ssl=require
  - name: ota-secret
    literals:
      - OTA_DB_PASSWORD=ironmesh-dev
      - OTA_INTERNAL_TOKEN=dev-ota-internal-token
      # The "ota" entry of REGISTRY_INTERNAL_TOKENS.
      - OTA_REGISTRY_TOKEN=dev-registry-token-ota
      - OTA_EMQX_API_KEY=ota
      - OTA_EMQX_API_SECRET=dev-emqx-ota-secret
      # SCRAM user `ota` (= KAFKA_OTA_PASSWORD in redpanda-users).
      - OTA_KAFKA_SASL_PASSWORD=dev-kafka-ota
      # Schema owner for the ota-migrate Job (python -m ironmesh_ota.migrate).
      - OTA_MIGRATION_DATABASE_URL=postgresql+asyncpg://ota_owner:ironmesh-dev@postgres:5432/ota?ssl=require
  - name: anomaly-secret
    literals:
      - ANOMALY_DB_PASSWORD=ironmesh-dev
      - ANOMALY_INTERNAL_TOKEN=dev-registry-token-anomaly
      - ANOMALY_SIEM_WEBHOOK_SECRET=dev-siem-webhook-secret
      # SCRAM user `anomaly` (= KAFKA_ANOMALY_PASSWORD in redpanda-users).
      - ANOMALY_KAFKA_SASL_PASSWORD=dev-kafka-anomaly
      - ANOMALY_DATABASE_MIGRATE_URL=postgresql://anomaly_owner:ironmesh-dev@postgres:5432/anomaly?sslmode=require
  - name: console-secret
    literals:
      - AUTH_SECRET=dev-console-auth-secret
      - CONSOLE_OIDC_CLIENT_SECRET=dev-console-oidc-client-secret
  - name: emqx-env
    literals:
      - EMQX_DASHBOARD__DEFAULT_PASSWORD=ironmesh-dev
      - EMQX_AUTHENTICATION__1__HEADERS__X-IRONMESH-HOOK-TOKEN=dev-emqx-hook-token
      - EMQX_AUTHORIZATION__SOURCES__1__HEADERS__X-IRONMESH-HOOK-TOKEN=dev-emqx-hook-token
      # = BRIDGE_EVENTS_TOKEN in bridge-secret.
      - EMQX_ACTIONS__HTTP__IRONMESH_AUTH_EVENTS__PARAMETERS__HEADERS__X-IRONMESH-HOOK-TOKEN=dev-bridge-events-token
  - name: emqx-api-keys
    files:
      - api-keys=emqx-api-keys.txt
  # Redpanda SCRAM users written by the redpanda-init Job (base/redpanda/init-job.yaml). `admin` is
  # the superuser that only writes ACLs; the service passwords match the *_KAFKA_SASL_PASSWORD
  # entries of the service secrets above.
  - name: redpanda-users
    literals:
      - KAFKA_ADMIN_PASSWORD=dev-kafka-admin
      - KAFKA_BRIDGE_PASSWORD=dev-kafka-bridge
      - KAFKA_REGISTRY_PASSWORD=dev-kafka-registry
      - KAFKA_OTA_PASSWORD=dev-kafka-ota
      - KAFKA_ANOMALY_PASSWORD=dev-kafka-anomaly

patches:
  # Expose console, broker, PKI and registry on the kind node ports mapped in kind-config.yaml.
  - path: patches/nodeports.yaml
