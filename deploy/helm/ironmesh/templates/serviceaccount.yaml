{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
{{- $ctx := dict "root" $ "name" $name }}
{{- $annotations := deepCopy $.Values.serviceAccount.annotations }}
{{- if $svc.serviceAccount.roleArn }}
{{- $_ := set $annotations "eks.amazonaws.com/role-arn" $svc.serviceAccount.roleArn }}
{{- $_ := set $annotations "eks.amazonaws.com/sts-regional-endpoints" "true" }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ironmesh.svcName" $ctx }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "ironmesh.svcLabels" $ctx | nindent 4 }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ $.Values.serviceAccount.automountToken }}
{{- end }}
{{- end }}
