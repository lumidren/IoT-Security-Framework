{{- if .Values.externalSecrets.enabled }}
{{- $es := .Values.externalSecrets }}
{{- range $name, $svc := .Values.services }}
{{- if and $svc.enabled (not $svc.secret.existingSecret) }}
{{- $ctx := dict "root" $ "name" $name }}
---
# Secrets Manager secret <prefix><service> is a JSON object whose keys are the environment
# variable names listed in services.{{ $name }}.secretKeys.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "ironmesh.svcName" $ctx }}-secret
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "ironmesh.svcLabels" $ctx | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $es.clusterSecretStore }}
  target:
    name: {{ include "ironmesh.secretName" $ctx }}
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: {{ printf "%s%s" $es.secretPathPrefix $name | quote }}
        decodingStrategy: None
{{- end }}
{{- end }}
{{- if .Values.emqx.enabled }}
---
# EMQX environment: dashboard password from <prefix>emqx, hook token shared with the policy
# service (single source of truth: the policy secret).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.emqx.envFromSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ironmesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: emqx
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $es.clusterSecretStore }}
  target:
    name: {{ .Values.emqx.envFromSecret }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        EMQX_DASHBOARD__DEFAULT_PASSWORD: {{ `"{{ .dashboard_password }}"` }}
        EMQX_AUTHENTICATION__1__HEADERS__X-IRONMESH-HOOK-TOKEN: {{ `"{{ .hook_token }}"` }}
        EMQX_AUTHORIZATION__SOURCES__1__HEADERS__X-IRONMESH-HOOK-TOKEN: {{ `"{{ .hook_token }}"` }}
  data:
    - secretKey: dashboard_password
      remoteRef:
        key: {{ printf "%semqx" $es.secretPathPrefix | quote }}
        property: dashboard_password
    - secretKey: hook_token
      remoteRef:
        key: {{ printf "%spolicy" $es.secretPathPrefix | quote }}
        property: POLICY_HOOK_TOKEN
---
# EMQX management API bootstrap keys ("key:secret:role" per line): policy (session kicks,
# POLICY_EMQX_API_KEY/SECRET), registry (kick + publish, REGISTRY_EMQX_API_KEY/SECRET) and ota
# (OtaNotify publish, OTA_EMQX_API_KEY/SECRET), each from its service secret.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ironmesh-emqx-api-keys
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ironmesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: emqx
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $es.clusterSecretStore }}
  target:
    name: ironmesh-emqx-api-keys
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        api-keys: {{ `"{{ .policy_api_key }}:{{ .policy_api_secret }}:administrator\n{{ .registry_api_key }}:{{ .registry_api_secret }}:administrator\n{{ .ota_api_key }}:{{ .ota_api_secret }}:administrator\n"` }}
  data:
    - secretKey: policy_api_key
      remoteRef:
        key: {{ printf "%spolicy" $es.secretPathPrefix | quote }}
        property: POLICY_EMQX_API_KEY
    - secretKey: policy_api_secret
      remoteRef:
        key: {{ printf "%spolicy" $es.secretPathPrefix | quote }}
        property: POLICY_EMQX_API_SECRET
    - secretKey: registry_api_key
      remoteRef:
        key: {{ printf "%sregistry" $es.secretPathPrefix | quote }}
        property: REGISTRY_EMQX_API_KEY
    - secretKey: registry_api_secret
      remoteRef:
        key: {{ printf "%sregistry" $es.secretPathPrefix | quote }}
        property: REGISTRY_EMQX_API_SECRET
    - secretKey: ota_api_key
      remoteRef:
        key: {{ printf "%sota" $es.secretPathPrefix | quote }}
        property: OTA_EMQX_API_KEY
    - secretKey: ota_api_secret
      remoteRef:
        key: {{ printf "%sota" $es.secretPathPrefix | quote }}
        property: OTA_EMQX_API_SECRET
{{- end }}
{{- if .Values.dbInit.enabled }}
---
# RDS-managed master credentials ({"username": ..., "password": ...}) for the db-init job.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.dbInit.adminSecretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ironmesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: db-init
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $es.clusterSecretStore }}
  target:
    name: {{ .Values.dbInit.adminSecretName }}
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: {{ printf "%spostgres-admin" $es.secretPathPrefix | quote }}
        decodingStrategy: None
{{- end }}
{{- end }}
