{{- if and .Values.monitoring.enabled .Values.monitoring.prometheusRule.enabled }}
---
# Mirrors observability/prometheus/rules/ironmesh.rules.yml (embedded verbatim from
# rules/ironmesh.rules.yml inside the chart; CI diffs the two copies).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "ironmesh.fullname" . }}-rules
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ironmesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: alerting
    {{- with .Values.monitoring.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- .Files.Get "rules/ironmesh.rules.yml" | nindent 2 }}
{{- end }}
