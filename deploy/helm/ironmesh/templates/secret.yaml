{{- /*
Secrets created from values are for development clusters only. Real environments either run
the External Secrets Operator (externalSecrets.enabled) or reference pre-created Secrets
through services.<name>.secret.existingSecret.
*/}}
{{- if not .Values.externalSecrets.enabled }}
{{- range $name, $svc := .Values.services }}
{{- if and $svc.enabled $svc.secret.create (not $svc.secret.existingSecret) }}
{{- $ctx := dict "root" $ "name" $name }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ironmesh.secretName" $ctx }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "ironmesh.svcLabels" $ctx | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := $svc.secret.data }}
  {{ $k }}: {{ toString $v | quote }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
