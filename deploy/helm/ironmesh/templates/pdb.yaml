{{- range $name, $svc := .Values.services }}
{{- if and $svc.enabled $svc.pdb.enabled }}
{{- $ctx := dict "root" $ "name" $name }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "ironmesh.svcName" $ctx }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "ironmesh.svcLabels" $ctx | nindent 4 }}
spec:
  minAvailable: {{ $svc.pdb.minAvailable }}
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      {{- include "ironmesh.svcSelectorLabels" $ctx | nindent 6 }}
{{- end }}
{{- end }}
