# Staging posture on EKS (eu-west-1). Combine with values-staging.generated.yaml produced by
# `terraform output -raw helm_values` (IRSA ARNs, target groups, RDS host, Kafka bootstrap,
# bucket names, KMS aliases):
#
#   helm upgrade --install ironmesh deploy/helm/ironmesh -n ironmesh --create-namespace \
#     -f deploy/helm/ironmesh/values.yaml -f deploy/helm/ironmesh/values-staging.yaml \
#     -f deploy/helm/ironmesh/values-staging.generated.yaml

global:
  environment: staging
  domain: staging.ironmesh.dev
  imageTag: 0.1.0

aws:
  enabled: true
  region: eu-west-1
  targetGroupBindings:
    enabled: true
    manageNetworking: false

# Edge is the Terraform ALB/NLB; no in-cluster ingress controller.
ingress:
  enabled: false

database:
  sslMode: verify-full
  iamAuth: true

# Console users' IdP: every service's *_OIDC_ISSUER (registry, ota, anomaly, policy, console)
# falls back to it.
oidc:
  issuer: https://auth.staging.ironmesh.dev/realms/ironmesh

kafka:
  mode: msk-serverless
  saslMechanism: AWS_MSK_IAM
  tlsEnabled: true
  externalPort: 9098

otelCollector:
  endpoint: http://otel-collector.observability.svc.cluster.local:4317
  traceSamplingRatio: "0.25"

monitoring:
  enabled: true
  namespace: observability

externalSecrets:
  enabled: true
  clusterSecretStore: aws-secrets-manager
  secretPathPrefix: ironmesh/staging/

internalTls:
  certManager:
    enabled: true
    issuerRef:
      # CA Issuer holding the Services issuing CA (signed by the KMS Services CA in the ceremony).
      name: ironmesh-services-issuing-ca
      kind: Issuer

dbInit:
  enabled: true
  adminSecretName: ironmesh-postgres-admin

networkPolicy:
  enabled: true
  # ALB/NLB (ip targets) reach pods from the VPC.
  loadBalancerCidrs:
    - 10.40.0.0/16
  externalHttpsEgress:
    enabled: true
    cidrs:
      - 0.0.0.0/0

services:
  pki:
    replicas: 2
    autoscaling:
      minReplicas: 2
      maxReplicas: 4
    config:
      PKI_ENV: staging
      PKI_KMS: awskms
      # RDS IAM tokens for PKI_DATABASE_URL (postgres://pki_app@...; rds_iam granted by db-init).
      PKI_DB_IAM_AUTH: "true"
      PKI_DB_IAM_REGION: eu-west-1
      # Ed25519 bundle key seed from Secrets Manager: set by values-staging.generated.yaml
      # (terraform output helm_values: services.pki.config.PKI_BUNDLE_KEY_SECRET_ARN).
      PKI_BUNDLE_KEY_SECRET_ARN: ""
      PKI_LOG_LEVEL: debug
  policy:
    autoscaling:
      minReplicas: 2
      maxReplicas: 4
    config:
      POLICY_LOG_LEVEL: debug
  bridge:
    autoscaling:
      minReplicas: 2
      maxReplicas: 4
    config:
      # MSK Serverless with IAM: AWS_MSK_IAM signed with the IRSA role, over TLS (system roots).
      BRIDGE_KAFKA_SASL_MECHANISM: aws-msk-iam
      BRIDGE_KAFKA_TLS_ENABLED: "true"
  registry:
    autoscaling:
      minReplicas: 2
      maxReplicas: 4
    config:
      REGISTRY_ENVIRONMENT: staging
      REGISTRY_KMS_BACKEND: aws
      REGISTRY_KMS_AWS_REGION: eu-west-1
      REGISTRY_LOG_LEVEL: debug
  ota:
    autoscaling:
      minReplicas: 2
      maxReplicas: 3
    config:
      # The prod profile's start-up checks (S3, KMS-wrapped keys, OIDC, Kafka, peers) apply.
      OTA_ENV: prod
      OTA_ARTIFACT_STORE: s3
      OTA_SIGNING_PROVIDER: kms-wrapped
      OTA_AWS_REGION: eu-west-1
      OTA_S3_REGION: eu-west-1
      OTA_LOG_LEVEL: debug
  anomaly:
    autoscaling:
      minReplicas: 2
      maxReplicas: 3
    config:
      ANOMALY_ENVIRONMENT: staging
      ANOMALY_AUTO_QUARANTINE: "false"
      ANOMALY_DB_REGION: eu-west-1
      ANOMALY_LOG_LEVEL: debug
  console:
    autoscaling:
      minReplicas: 2
      maxReplicas: 3
    # CONSOLE_OIDC_ISSUER / NEXT_PUBLIC_OIDC_ISSUER come from oidc.issuer.
    config: {}

emqx:
  replicaCount: 3
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi
  persistence:
    enabled: true
    size: 5Gi
    storageClassName: gp3-encrypted

redpanda:
  enabled: false
