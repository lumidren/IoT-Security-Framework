# ------------------------------------------------------------------------------------------
# EMQX 5 (dependency: https://repos.emqx.io/charts, chart emqx)
# ------------------------------------------------------------------------------------------
# Configuration is passed as environment overrides (EMQX_<PATH>__<KEY>). Listener 8883 is the
# only MQTT listener: TLS 1.3 only, client certificate required (Device CA bundle, partial
# chain), EKU clientAuth enforced, username = certificate CN. Authentication and authorization
# are delegated to the policy service over HTTP with a shared hook token.
emqx:
  enabled: true
  replicaCount: 3
  image:
    repository: emqx/emqx
    tag: 5.8.9
  # The chart's own TLS automation is disabled; certificates are mounted explicitly below.
  ssl:
    enabled: false
  # Secret produced by templates/externalsecret.yaml (or by hand): EMQX_DASHBOARD__DEFAULT_PASSWORD
  # and the X-IronMesh-Hook-Token headers.
  envFromSecret: ironmesh-emqx-env
  emqxConfig:
    EMQX_CLUSTER__DISCOVERY_STRATEGY: dns
    EMQX_DASHBOARD__DEFAULT_USERNAME: admin
    EMQX_LISTENERS__TCP__DEFAULT__ENABLE: "false"
    EMQX_LISTENERS__WS__DEFAULT__ENABLE: "false"
    EMQX_LISTENERS__WSS__DEFAULT__ENABLE: "false"
    EMQX_LISTENERS__SSL__DEFAULT__BIND: "0.0.0.0:8883"
    EMQX_LISTENERS__SSL__DEFAULT__ENABLE_AUTHN: quick_deny_anonymous
    EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__VERSIONS: "[tlsv1.3]"
    EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__VERIFY: verify_peer
    EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__FAIL_IF_NO_PEER_CERT: "true"
    EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__PARTIAL_CHAIN: "true"
    EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__VERIFY_PEER_EXT_KEY_USAGE: clientAuth
    EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__CERTFILE: /etc/ironmesh/tls/tls.crt
    EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__KEYFILE: /etc/ironmesh/tls/tls.key
    EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__CACERTFILE: /etc/ironmesh/device-ca/ca.crt
    EMQX_MQTT__PEER_CERT_AS_USERNAME: cn
    EMQX_MQTT__SESSION_EXPIRY_INTERVAL: 7d
    EMQX_MQTT__MAX_PACKET_SIZE: 1MB
    EMQX_MQTT__RETAIN_AVAILABLE: "true"
    EMQX_MQTT__WILDCARD_SUBSCRIPTION: "true"
    EMQX_MQTT__SHARED_SUBSCRIPTION: "true"
    EMQX_AUTHENTICATION__1__MECHANISM: password_based
    EMQX_AUTHENTICATION__1__BACKEND: http
    EMQX_AUTHENTICATION__1__METHOD: post
    EMQX_AUTHENTICATION__1__URL: http://ironmesh-policy:8081/emqx/authn
    EMQX_AUTHENTICATION__1__BODY__CLIENTID: "${clientid}"
    EMQX_AUTHENTICATION__1__BODY__USERNAME: "${username}"
    EMQX_AUTHENTICATION__1__BODY__CERT_COMMON_NAME: "${cert_common_name}"
    EMQX_AUTHENTICATION__1__BODY__CERT_SUBJECT: "${cert_subject}"
    EMQX_AUTHENTICATION__1__BODY__PEERHOST: "${peerhost}"
    EMQX_AUTHENTICATION__1__CONNECT_TIMEOUT: 5s
    EMQX_AUTHENTICATION__1__REQUEST_TIMEOUT: 5s
    EMQX_AUTHENTICATION__1__POOL_SIZE: "16"
    EMQX_AUTHORIZATION__NO_MATCH: deny
    EMQX_AUTHORIZATION__DENY_ACTION: disconnect
    EMQX_AUTHORIZATION__CACHE__ENABLE: "true"
    EMQX_AUTHORIZATION__CACHE__TTL: 10s
    EMQX_AUTHORIZATION__SOURCES__1__TYPE: http
    EMQX_AUTHORIZATION__SOURCES__1__METHOD: post
    EMQX_AUTHORIZATION__SOURCES__1__URL: http://ironmesh-policy:8081/emqx/authz
    EMQX_AUTHORIZATION__SOURCES__1__BODY__CLIENTID: "${clientid}"
    EMQX_AUTHORIZATION__SOURCES__1__BODY__USERNAME: "${username}"
    EMQX_AUTHORIZATION__SOURCES__1__BODY__TOPIC: "${topic}"
    EMQX_AUTHORIZATION__SOURCES__1__BODY__ACTION: "${action}"
    EMQX_AUTHORIZATION__SOURCES__1__BODY__QOS: "${qos}"
    EMQX_AUTHORIZATION__SOURCES__1__BODY__RETAIN: "${retain}"
    EMQX_AUTHORIZATION__SOURCES__1__CONNECT_TIMEOUT: 5s
    EMQX_AUTHORIZATION__SOURCES__1__REQUEST_TIMEOUT: 5s
    # Management API key for the policy service (session kicks); file = "key:secret:role" lines.
    EMQX_API_KEY__BOOTSTRAP_FILE: /etc/ironmesh/emqx-api-keys/api-keys
    EMQX_PROMETHEUS__ENABLE_BASIC_AUTH: "false"
    EMQX_OPENTELEMETRY__EXPORTER__ENDPOINT: http://otel-collector.observability.svc.cluster.local:4317
    EMQX_OPENTELEMETRY__METRICS__ENABLE: "true"
    EMQX_OPENTELEMETRY__TRACES__ENABLE: "true"
    EMQX_LOG__CONSOLE__FORMATTER: json
    EMQX_LOG__CONSOLE__LEVEL: warning
  extraVolumes:
    - name: tls
      secret:
        secretName: ironmesh-emqx-tls
        defaultMode: 0440
    - name: device-ca
      secret:
        secretName: ironmesh-device-ca-bundle
    - name: api-keys
      secret:
        secretName: ironmesh-emqx-api-keys
        defaultMode: 0440
  extraVolumeMounts:
    - name: tls
      mountPath: /etc/ironmesh/tls
      readOnly: true
    - name: device-ca
      mountPath: /etc/ironmesh/device-ca
      readOnly: true
    - name: api-keys
      mountPath: /etc/ironmesh/emqx-api-keys
      readOnly: true
  service:
    type: ClusterIP
    mqttssl: 8883
    dashboard: 18083
  pdb:
    enabled: true
    maxUnavailable: 1
  persistence:
    enabled: true
    size: 5Gi
    storageClassName: ""
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: emqx
  # The chart's own ServiceMonitor is not used; templates/servicemonitor.yaml scrapes
  # /api/v5/prometheus/stats on 18083.
  metrics:
    enabled: false
  nodeSelector: {}
  tolerations: []

# Certificate for the broker listener (Services CA, SAN = mqtt host + in-cluster names).
emqxTls:
  certManager:
    enabled: true
  secretName: ironmesh-emqx-tls
  extraDnsNames: []

# ------------------------------------------------------------------------------------------
# Redpanda (dependency: https://charts.redpanda.com, chart redpanda). Self-hosted Kafka for
# clusters without MSK (kafka.mode=redpanda).
# ------------------------------------------------------------------------------------------
redpanda:
  enabled: false
  statefulset:
    replicas: 3
    budget:
      maxUnavailable: 1
  # In-cluster plaintext guarded by NetworkPolicy. Set tls.enabled=true and point
  # *_KAFKA_TLS_ENABLED / CA at <release>-redpanda-default-cert for TLS between pods.
  tls:
    enabled: false
  external:
    enabled: false
  console:
    enabled: false
  listeners:
    kafka:
      port: 9092
    admin:
      port: 9644
  auth:
    sasl:
      enabled: false
  resources:
    cpu:
      cores: 1
    memory:
      container:
        max: 2.5Gi
  storage:
    persistentVolume:
      enabled: true
      size: 50Gi
      storageClass: ""
  config:
    cluster:
      auto_create_topics_enabled: false
      default_topic_replications: 3
  monitoring:
    enabled: false
