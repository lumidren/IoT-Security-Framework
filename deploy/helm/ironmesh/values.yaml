# ------------------------------------------------------------------------------------------
# EMQX 5 (dependency: https://repos.emqx.io/charts, chart emqx)
# ------------------------------------------------------------------------------------------
# Configuration is passed as environment overrides (EMQX_<PATH>__<KEY>). Two MQTT listeners,
# both TLS 1.3 only with a client certificate required, EKU clientAuth enforced and
# username = certificate CN; authentication and authorization are delegated to the policy
# service over HTTP with a shared hook token:
#   ssl:default  8883  devices (NLB). Device CA bundle, per-client rate limits (T-40).
#   ssl:internal 8884  svc-bridge / svc-registry only (ClusterIP <release>-emqx-internal,
#                      NetworkPolicy). Services CA only, zone `internal`, no message-rate limit.
#
# Per-client limits on the device listener (T-40), sized for telemetry every 10 s
# (DESIGN_CONTRACT.md section 4; minimum agent interval 5 s): a healthy device publishes about
# 0.1-0.2 msg/s (telemetry + shadow/OTA/command replies) of < 2 KB each.
#   messages_rate 10/s   ~50x the steady rate, so a reconnecting agent drains its offline buffer
#                        quickly; a compromised device is capped at 10 msg/s. EMQX throttles (pauses
#                        the socket), it does not drop.
#   bytes_rate   64KB/s  = mqtt.max_packet_size (one maximum-size packet per second).
#   max_conn_rate 500/s  per listener and node (values-prod.yaml: 2000/s), bounds reconnect storms
#                        and TLS handshake floods.
#   mqtt.max_inflight 32 = the contract's receive maximum; mqtt.max_awaiting_rel 16 (QoS 2 is
#                        refused anyway, max_qos_allowed = 1).
#
# Management API / dashboard (18083, T-76): EMQX 5 serves the dashboard UI and the REST API that
# policy (kick), registry (kick) and ota (publish/bulk) call from the same HTTP listener, so it
# cannot be disabled or bound to 127.0.0.1 here. It is reachable only through the ClusterIP and
# the NetworkPolicy admits only the policy, registry and ota pods plus the Prometheus scraper
# (/api/v5/prometheus/stats lives on the same port; NetworkPolicy cannot filter by path). Swagger
# is off and the dashboard admin password comes from envFromSecret.
emqx:
  enabled: true
  replicaCount: 3
  image:
    repository: emqx/emqx
    tag: 5.8.9
  # The chart's own TLS automation is disabled; certificates are mounted explicitly below.
  ssl:
    enabled: false
  # Secret produced by templates/externalsecret.yaml (or by hand): EMQX_DASHBOARD__DEFAULT_PASSWORD,
  # the policy X-IronMesh-Hook-Token headers (= POLICY_HOOK_TOKEN) and the webhook action header
  # EMQX_ACTIONS__HTTP__IRONMESH_AUTH_EVENTS__PARAMETERS__HEADERS__X-IRONMESH-HOOK-TOKEN
  # (= BRIDGE_EVENTS_TOKEN).
  envFromSecret: ironmesh-emqx-env
  emqxConfig:
    EMQX_CLUSTER__DISCOVERY_STRATEGY: dns
    EMQX_DASHBOARD__DEFAULT_USERNAME: admin
    EMQX_DASHBOARD__SWAGGER_SUPPORT: "false"
    EMQX_LISTENERS__TCP__DEFAULT__ENABLE: "false"
    EMQX_LISTENERS__WS__DEFAULT__ENABLE: "false"
    EMQX_LISTENERS__WSS__DEFAULT__ENABLE: "false"
    # Device listener (NLB target group, 8883).
    EMQX_LISTENERS__SSL__DEFAULT__BIND: "0.0.0.0:8883"
    EMQX_LISTENERS__SSL__DEFAULT__ENABLE_AUTHN: quick_deny_anonymous
    EMQX_LISTENERS__SSL__DEFAULT__MESSAGES_RATE: 10/s
    EMQX_LISTENERS__SSL__DEFAULT__BYTES_RATE: 64KB/s
    EMQX_LISTENERS__SSL__DEFAULT__MAX_CONN_RATE: 500/s
    EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__VERSIONS: "[tlsv1.3]"
    EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__VERIFY: verify_peer
    EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__FAIL_IF_NO_PEER_CERT: "true"
    EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__PARTIAL_CHAIN: "true"
    EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__VERIFY_PEER_EXT_KEY_USAGE: clientAuth
    EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__CERTFILE: /etc/ironmesh/tls/tls.crt
    EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__KEYFILE: /etc/ironmesh/tls/tls.key
    EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__CACERTFILE: /etc/ironmesh/device-ca/ca.crt
    # Internal service listener (8884, ClusterIP <release>-emqx-internal, never on the NLB):
    # svc-bridge (shared subscription) and svc-registry (downlink publisher). Only the Services CA
    # (ca.crt of the cert-manager broker certificate) is trusted, so device certificates fail
    # the handshake here.
    EMQX_LISTENERS__SSL__INTERNAL__ENABLE: "true"
    EMQX_LISTENERS__SSL__INTERNAL__BIND: "0.0.0.0:8884"
    EMQX_LISTENERS__SSL__INTERNAL__ZONE: internal
    EMQX_LISTENERS__SSL__INTERNAL__ENABLE_AUTHN: quick_deny_anonymous
    EMQX_LISTENERS__SSL__INTERNAL__MAX_CONNECTIONS: "1024"
    EMQX_LISTENERS__SSL__INTERNAL__MAX_CONN_RATE: 100/s
    EMQX_LISTENERS__SSL__INTERNAL__SSL_OPTIONS__VERSIONS: "[tlsv1.3]"
    EMQX_LISTENERS__SSL__INTERNAL__SSL_OPTIONS__VERIFY: verify_peer
    EMQX_LISTENERS__SSL__INTERNAL__SSL_OPTIONS__FAIL_IF_NO_PEER_CERT: "true"
    EMQX_LISTENERS__SSL__INTERNAL__SSL_OPTIONS__PARTIAL_CHAIN: "true"
    EMQX_LISTENERS__SSL__INTERNAL__SSL_OPTIONS__VERIFY_PEER_EXT_KEY_USAGE: clientAuth
    EMQX_LISTENERS__SSL__INTERNAL__SSL_OPTIONS__CERTFILE: /etc/ironmesh/tls/tls.crt
    EMQX_LISTENERS__SSL__INTERNAL__SSL_OPTIONS__KEYFILE: /etc/ironmesh/tls/tls.key
    EMQX_LISTENERS__SSL__INTERNAL__SSL_OPTIONS__CACERTFILE: /etc/ironmesh/tls/ca.crt
    # Default zone = device sessions (see the sizing notes above).
    EMQX_MQTT__PEER_CERT_AS_USERNAME: cn
    EMQX_MQTT__SESSION_EXPIRY_INTERVAL: 7d
    EMQX_MQTT__MAX_PACKET_SIZE: 64KB
    EMQX_MQTT__MAX_QOS_ALLOWED: "1"
    EMQX_MQTT__MAX_INFLIGHT: "32"
    EMQX_MQTT__MAX_AWAITING_REL: "16"
    EMQX_MQTT__RETAIN_AVAILABLE: "true"
    EMQX_MQTT__WILDCARD_SUBSCRIPTION: "true"
    EMQX_MQTT__SHARED_SUBSCRIPTION: "true"
    # Zone `internal` (service sessions): inflight window = BRIDGE_MAX_INFLIGHT, larger packets for
    # service-to-service traffic (device sessions still cap downlinks at 64KB).
    EMQX_ZONES__INTERNAL__MQTT__MAX_INFLIGHT: "1024"
    EMQX_ZONES__INTERNAL__MQTT__MAX_AWAITING_REL: "100"
    EMQX_ZONES__INTERNAL__MQTT__MAX_PACKET_SIZE: 1MB
    EMQX_AUTHENTICATION__1__MECHANISM: password_based
    EMQX_AUTHENTICATION__1__BACKEND: http
    EMQX_AUTHENTICATION__1__METHOD: post
    EMQX_AUTHENTICATION__1__URL: http://ironmesh-policy:8081/emqx/authn
    EMQX_AUTHENTICATION__1__BODY__CLIENTID: "${clientid}"
    EMQX_AUTHENTICATION__1__BODY__USERNAME: "${username}"
    EMQX_AUTHENTICATION__1__BODY__CERT_COMMON_NAME: "${cert_common_name}"
    EMQX_AUTHENTICATION__1__BODY__CERT_SUBJECT: "${cert_subject}"
    EMQX_AUTHENTICATION__1__BODY__PEERHOST: "${peerhost}"
    EMQX_AUTHENTICATION__1__CONNECT_TIMEOUT: 5s
    EMQX_AUTHENTICATION__1__REQUEST_TIMEOUT: 5s
    EMQX_AUTHENTICATION__1__POOL_SIZE: "16"
    EMQX_AUTHORIZATION__NO_MATCH: deny
    EMQX_AUTHORIZATION__DENY_ACTION: disconnect
    EMQX_AUTHORIZATION__CACHE__ENABLE: "true"
    EMQX_AUTHORIZATION__CACHE__TTL: 10s
    EMQX_AUTHORIZATION__SOURCES__1__TYPE: http
    EMQX_AUTHORIZATION__SOURCES__1__METHOD: post
    EMQX_AUTHORIZATION__SOURCES__1__URL: http://ironmesh-policy:8081/emqx/authz
    EMQX_AUTHORIZATION__SOURCES__1__BODY__CLIENTID: "${clientid}"
    EMQX_AUTHORIZATION__SOURCES__1__BODY__USERNAME: "${username}"
    EMQX_AUTHORIZATION__SOURCES__1__BODY__TOPIC: "${topic}"
    EMQX_AUTHORIZATION__SOURCES__1__BODY__ACTION: "${action}"
    EMQX_AUTHORIZATION__SOURCES__1__BODY__QOS: "${qos}"
    EMQX_AUTHORIZATION__SOURCES__1__BODY__RETAIN: "${retain}"
    EMQX_AUTHORIZATION__SOURCES__1__CONNECT_TIMEOUT: 5s
    EMQX_AUTHORIZATION__SOURCES__1__REQUEST_TIMEOUT: 5s
    # Client lifecycle / authn / authz events -> bridge POST /emqx/events -> im.auth (the
    # connector + action + rule of services/policy/deploy/emqx/emqx.conf as env overrides; string
    # values are HOCON-quoted). The action's token header comes from envFromSecret.
    # VERIFY against the deployed EMQX 5.8.x (`emqx ctl conf show actions`).
    EMQX_CONNECTORS__HTTP__IRONMESH_BRIDGE__ENABLE: "true"
    EMQX_CONNECTORS__HTTP__IRONMESH_BRIDGE__URL: '"http://ironmesh-bridge:8082"'
    EMQX_CONNECTORS__HTTP__IRONMESH_BRIDGE__CONNECT_TIMEOUT: 5s
    EMQX_CONNECTORS__HTTP__IRONMESH_BRIDGE__POOL_SIZE: "8"
    EMQX_ACTIONS__HTTP__IRONMESH_AUTH_EVENTS__ENABLE: "true"
    EMQX_ACTIONS__HTTP__IRONMESH_AUTH_EVENTS__CONNECTOR: ironmesh_bridge
    EMQX_ACTIONS__HTTP__IRONMESH_AUTH_EVENTS__PARAMETERS__PATH: '"/emqx/events"'
    EMQX_ACTIONS__HTTP__IRONMESH_AUTH_EVENTS__PARAMETERS__METHOD: post
    EMQX_ACTIONS__HTTP__IRONMESH_AUTH_EVENTS__PARAMETERS__HEADERS__CONTENT-TYPE: '"application/json"'
    EMQX_ACTIONS__HTTP__IRONMESH_AUTH_EVENTS__PARAMETERS__MAX_RETRIES: "3"
    EMQX_RULE_ENGINE__RULES__IRONMESH_AUTH_EVENTS__ENABLE: "true"
    EMQX_RULE_ENGINE__RULES__IRONMESH_AUTH_EVENTS__SQL: '"SELECT * FROM \"$events/client_connected\", \"$events/client_disconnected\", \"$events/client_check_authn_complete\", \"$events/client_check_authz_complete\" WHERE event = ''client.connected'' OR event = ''client.disconnected'' OR (event = ''client.check_authn_complete'' AND reason_code != ''success'') OR (event = ''client.check_authz_complete'' AND result = ''deny'')"'
    EMQX_RULE_ENGINE__RULES__IRONMESH_AUTH_EVENTS__ACTIONS: '["http:ironmesh_auth_events"]'
    # Management API keys for policy (session kicks), registry and ota (publish); file =
    # "key:secret:role" lines (templates/externalsecret.yaml).
    EMQX_API_KEY__BOOTSTRAP_FILE: /etc/ironmesh/emqx-api-keys/api-keys
    EMQX_PROMETHEUS__ENABLE_BASIC_AUTH: "false"
    EMQX_OPENTELEMETRY__EXPORTER__ENDPOINT: http://otel-collector.observability.svc.cluster.local:4317
    EMQX_OPENTELEMETRY__METRICS__ENABLE: "true"
    EMQX_OPENTELEMETRY__TRACES__ENABLE: "true"
    EMQX_LOG__CONSOLE__FORMATTER: json
    EMQX_LOG__CONSOLE__LEVEL: warning
  extraVolumes:
    - name: tls
      secret:
        secretName: ironmesh-emqx-tls
        defaultMode: 0440
    - name: device-ca
      secret:
        secretName: ironmesh-device-ca-bundle
    - name: api-keys
      secret:
        secretName: ironmesh-emqx-api-keys
        defaultMode: 0440
  extraVolumeMounts:
    - name: tls
      mountPath: /etc/ironmesh/tls
      readOnly: true
    - name: device-ca
      mountPath: /etc/ironmesh/device-ca
      readOnly: true
    - name: api-keys
      mountPath: /etc/ironmesh/emqx-api-keys
      readOnly: true
  service:
    type: ClusterIP
    mqttssl: 8883
    dashboard: 18083
  pdb:
    enabled: true
    maxUnavailable: 1
  persistence:
    enabled: true
    size: 5Gi
    storageClassName: ""
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: emqx
  # The chart's own ServiceMonitor is not used; templates/servicemonitor.yaml scrapes
  # /api/v5/prometheus/stats on 18083.
  metrics:
    enabled: false
  nodeSelector: {}
  tolerations: []

# Certificate for the broker listener (Services CA, SAN = mqtt host + in-cluster names).
emqxTls:
  certManager:
    enabled: true
  secretName: ironmesh-emqx-tls
  extraDnsNames: []

# ------------------------------------------------------------------------------------------
# Redpanda (dependency: https://charts.redpanda.com, chart redpanda). Self-hosted Kafka for
# clusters without MSK (kafka.mode=redpanda).
# ------------------------------------------------------------------------------------------
redpanda:
  enabled: false
  statefulset:
    replicas: 3
    budget:
      maxUnavailable: 1
  # In-cluster plaintext guarded by NetworkPolicy. Set tls.enabled=true and point
  # *_KAFKA_TLS_ENABLED / CA at <release>-redpanda-default-cert for TLS between pods.
  tls:
    enabled: false
  external:
    enabled: false
  console:
    enabled: false
  listeners:
    kafka:
      port: 9092
    admin:
      port: 9644
  auth:
    sasl:
      enabled: false
  resources:
    cpu:
      cores: 1
    memory:
      container:
        max: 2.5Gi
  storage:
    persistentVolume:
      enabled: true
      size: 50Gi
      storageClass: ""
  config:
    cluster:
      auto_create_topics_enabled: false
      default_topic_replications: 3
  monitoring:
    enabled: false
