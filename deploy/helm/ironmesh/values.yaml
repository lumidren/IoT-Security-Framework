      OTA_DB_NAME: ota
      OTA_DB_USER: ota_app
      OTA_DB_SSLMODE: ""
      OTA_DB_IAM_AUTH: ""
      OTA_KAFKA_BROKERS: ""
      OTA_KAFKA_TOPIC_INGEST: im.ingest
      OTA_KAFKA_TOPIC_COMMANDS: im.commands
      OTA_KAFKA_TOPIC_AUDIT: im.audit
      OTA_KAFKA_CONSUMER_GROUP: ota-status
      OTA_KAFKA_SASL_MECHANISM: ""
      OTA_KAFKA_TLS_ENABLED: ""
      # s3 | filesystem (dev only)
      OTA_ARTIFACT_STORE: s3
      OTA_ARTIFACT_BUCKET: ""
      OTA_S3_KMS_KEY_ARN: ""
      OTA_ARTIFACT_PATH: /var/lib/ironmesh/ota/artifacts
      # kms-wrapped | file (dev only)
      OTA_SIGNING_PROVIDER: kms-wrapped
      OTA_SIGNING_KEK_KEY_ID: ""
      OTA_SIGNING_KEY_SECRET_ARN: ""
      OTA_SIGNING_KEY_ID: fw-ed25519-1
      OTA_PQ_SIGNING_ENABLED: "false"
      OTA_PUBLIC_BASE_URL: ""
      OTA_PKI_URL: https://ironmesh-pki:8443
      OTA_REGISTRY_URL: http://ironmesh-registry:8000
      OTA_EMQX_API_URL: http://ironmesh-emqx:18083
      OTA_OIDC_ISSUER: ""
      OTA_OIDC_AUDIENCE: ironmesh-api
      OTA_TLS_CERT_FILE: /etc/ironmesh/tls/tls.crt
      OTA_TLS_KEY_FILE: /etc/ironmesh/tls/tls.key
      OTA_TLS_CA_FILE: /etc/ironmesh/tls/ca.crt
      OTA_LOG_LEVEL: info
      OTA_LOG_FORMAT: json
    extraEnv: []
    extraVolumes: []
    extraVolumeMounts: []
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: "2"
        memory: 1Gi
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
    pdb:
      enabled: true
      minAvailable: 1
    topologySpread:
      enabled: true
      maxSkew: 1
      whenUnsatisfiable: ScheduleAnyway
    terminationGracePeriodSeconds: 60
    priorityClassName: ""
    nodeSelector: {}
    tolerations: []
    affinity: {}

  anomaly:
    enabled: true
    image:
      repository: ironmesh-anomaly
      tag: ""
      digest: ""
    replicas: 2
    ports:
      http: 8002
    health:
      port: http
      scheme: HTTP
      livenessPath: /healthz
      readinessPath: /readyz
      startupFailureThreshold: 60
