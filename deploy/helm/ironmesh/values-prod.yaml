# Production posture on EKS (eu-west-1). Combine with values-prod.generated.yaml from
# `terraform output -raw helm_values`.
#
#   helm upgrade --install ironmesh deploy/helm/ironmesh -n ironmesh --create-namespace \
#     -f deploy/helm/ironmesh/values.yaml -f deploy/helm/ironmesh/values-prod.yaml \
#     -f deploy/helm/ironmesh/values-prod.generated.yaml

global:
  environment: prod
  domain: ironmesh.dev
  imageTag: 0.1.0

aws:
  enabled: true
  region: eu-west-1
  targetGroupBindings:
    enabled: true
    manageNetworking: false

ingress:
  enabled: false

database:
  sslMode: verify-full
  iamAuth: true

# Console users' IdP: every service's *_OIDC_ISSUER (registry, ota, anomaly, policy, console)
# falls back to it.
oidc:
  issuer: https://auth.ironmesh.dev/realms/ironmesh

kafka:
  mode: msk-provisioned
  saslMechanism: AWS_MSK_IAM
  tlsEnabled: true
  externalPort: 9098
  partitions: 12
  replicationFactor: 3

otelCollector:
  endpoint: http://otel-collector.observability.svc.cluster.local:4317
  traceSamplingRatio: "0.05"

monitoring:
  enabled: true
  namespace: observability

externalSecrets:
  enabled: true
  clusterSecretStore: aws-secrets-manager
  secretPathPrefix: ironmesh/prod/

internalTls:
  certManager:
    enabled: true
    issuerRef:
      name: ironmesh-services-issuing-ca
      kind: Issuer

dbInit:
  enabled: true
  adminSecretName: ironmesh-postgres-admin

networkPolicy:
  enabled: true
  loadBalancerCidrs:
    - 10.50.0.0/16
  externalHttpsEgress:
    enabled: true
    # VPC endpoints for STS/KMS/S3/Secrets Manager live in the VPC; OIDC issuer is external.
    cidrs:
      - 0.0.0.0/0
  allowHelmTest: false

services:
  pki:
    replicas: 3
    autoscaling:
      minReplicas: 3
      maxReplicas: 8
    pdb:
      minAvailable: 2
    topologySpread:
      whenUnsatisfiable: DoNotSchedule
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: "2"
        memory: 1Gi
    config:
      PKI_ENV: production
      PKI_KMS: awskms
      # RDS IAM tokens for PKI_DATABASE_URL (postgres://pki_app@...; rds_iam granted by db-init).
      PKI_DB_IAM_AUTH: "true"
      PKI_DB_IAM_REGION: eu-west-1
      # Ed25519 bundle key seed from Secrets Manager: set by values-prod.generated.yaml
      # (terraform output helm_values: services.pki.config.PKI_BUNDLE_KEY_SECRET_ARN).
      PKI_BUNDLE_KEY_SECRET_ARN: ""
      PKI_LOG_LEVEL: info
  policy:
    replicas: 3
    autoscaling:
      minReplicas: 3
      maxReplicas: 12
    pdb:
      minAvailable: 2
    topologySpread:
      whenUnsatisfiable: DoNotSchedule
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: "2"
        memory: 1Gi
    config:
      POLICY_LOG_LEVEL: info
  bridge:
    replicas: 3
    autoscaling:
      minReplicas: 3
      maxReplicas: 16
      targetCPUUtilizationPercentage: 60
    pdb:
      minAvailable: 2
    topologySpread:
      whenUnsatisfiable: DoNotSchedule
    resources:
      requests:
        cpu: 500m
        memory: 256Mi
      limits:
        cpu: "2"
        memory: 1Gi
    config:
      # MSK with IAM: SASL AWS_MSK_IAM signed with the IRSA role, over TLS
      # (system roots verify the brokers).
      BRIDGE_KAFKA_SASL_MECHANISM: aws-msk-iam
      BRIDGE_KAFKA_TLS_ENABLED: "true"
  registry:
    replicas: 3
    autoscaling:
      minReplicas: 3
      maxReplicas: 12
    pdb:
      minAvailable: 2
    topologySpread:
      whenUnsatisfiable: DoNotSchedule
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 2Gi
    config:
      REGISTRY_ENVIRONMENT: prod
      REGISTRY_KMS_BACKEND: aws
      REGISTRY_KMS_AWS_REGION: eu-west-1
  ota:
    replicas: 3
    autoscaling:
      minReplicas: 3
      maxReplicas: 8
    pdb:
      minAvailable: 2
    topologySpread:
      whenUnsatisfiable: DoNotSchedule
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 2Gi
    config:
      OTA_ENV: prod
      OTA_ARTIFACT_STORE: s3
      OTA_SIGNING_PROVIDER: kms-wrapped
      OTA_AWS_REGION: eu-west-1
      OTA_S3_REGION: eu-west-1
      OTA_PQ_SIGNING_ENABLED: "true"
  anomaly:
    replicas: 3
    autoscaling:
      minReplicas: 3
      maxReplicas: 8
    pdb:
      minAvailable: 2
    topologySpread:
      whenUnsatisfiable: DoNotSchedule
    resources:
      requests:
        cpu: "1"
        memory: 1Gi
      limits:
        cpu: "4"
        memory: 4Gi
    config:
      # Keep dry-run until rules are tuned on prod traffic (SECURITY.md), then flip to "true".
      ANOMALY_ENVIRONMENT: prod
      ANOMALY_AUTO_QUARANTINE: "false"
      ANOMALY_QUARANTINE_MIN_SEVERITY: high
      ANOMALY_DB_REGION: eu-west-1
  console:
    replicas: 3
    autoscaling:
      minReplicas: 3
      maxReplicas: 8
    pdb:
      minAvailable: 2
    topologySpread:
      whenUnsatisfiable: DoNotSchedule
    # CONSOLE_OIDC_ISSUER / NEXT_PUBLIC_OIDC_ISSUER come from oidc.issuer.
    config: {}

emqx:
  replicaCount: 3
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      cpu: "4"
      memory: 8Gi
  persistence:
    enabled: true
    size: 20Gi
    storageClassName: gp3-encrypted
  # Dedicated broker node group (deploy/terraform/aws environments/prod.tfvars).
  nodeSelector:
    ironmesh.dev/workload: broker
  tolerations:
    - key: ironmesh.dev/workload
      operator: Equal
      value: broker
      effect: NoSchedule
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: emqx
  emqxConfig:
    EMQX_LOG__CONSOLE__LEVEL: warning
    EMQX_LISTENERS__SSL__DEFAULT__MAX_CONNECTIONS: "500000"
    EMQX_LISTENERS__SSL__DEFAULT__MAX_CONN_RATE: "2000/s"

redpanda:
  enabled: false
