[workspace]
members = ["."]
exclude = ["fuzz"]
resolver = "2"

[package]
name = "ironmesh-agent"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "IronMesh Linux device agent and virtual fleet simulator"
publish = false
default-run = "ironmesh-agent"

[features]
default = ["pq"]
pq = ["dep:ml-dsa"]
tpm = ["dep:tss-esapi"]
optee = ["dep:optee-teec"]
keyring = ["dep:keyring"]
dut-control = []

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
der = { version = "0.7", features = ["alloc", "oid", "std"] }
ed25519-dalek = { version = "2.2", features = ["rand_core", "zeroize"] }
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
p256 = { version = "0.14", features = ["ecdsa", "ecdh", "pkcs8", "pem"] }
rand = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = "0.32"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "fs", "signal", "process", "io-std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter", "fmt"] }
x509-cert = { version = "0.2", features = ["std"] }
zeroize = { version = "1.8", features = ["derive"] }
ml-dsa = { version = "0.1", optional = true }
tss-esapi = { version = "7.6", optional = true }
optee-teec = { version = "0.9", optional = true }
keyring = { version = "3", optional = true, features = ["linux-native", "windows-native", "apple-native"] }

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem", "x509-parser"] }
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
proptest = "1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
tower = { version = "0.5", features = ["util"] }
time = "0.3"

[[bin]]
name = "ironmesh-agent"
path = "src/main.rs"

[[bin]]
name = "ironmesh-fleet"
path = "src/bin/ironmesh-fleet.rs"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
