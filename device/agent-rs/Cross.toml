# `cross build --release --target aarch64-unknown-linux-gnu [--features tpm|optee]`
# The TPM / OP-TEE backends need the target's system libraries inside the cross image.
[build]
default-target = "aarch64-unknown-linux-gnu"

[target.aarch64-unknown-linux-gnu]
pre-build = [
    "dpkg --add-architecture $CROSS_DEB_ARCH",
    "apt-get update && apt-get install --assume-yes --no-install-recommends libtss2-dev:$CROSS_DEB_ARCH pkg-config",
]

[target.aarch64-unknown-linux-gnu.env]
passthrough = ["IRONMESH_PQ_REQUIRED", "TEEC_EXPORT", "PKG_CONFIG_ALLOW_CROSS"]

[target.armv7-unknown-linux-gnueabihf]
pre-build = [
    "dpkg --add-architecture $CROSS_DEB_ARCH",
    "apt-get update && apt-get install --assume-yes --no-install-recommends libtss2-dev:$CROSS_DEB_ARCH pkg-config",
]
