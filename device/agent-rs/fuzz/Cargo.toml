[package]
name = "ironmesh-agent-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4"
ironmesh-agent = { path = ".." }
p256 = "0.13"
ed25519-dalek = "2.2"

[profile.release]
debug = 1

[[bin]]
name = "cbor_decode"
path = "fuzz_targets/cbor_decode.rs"
test = false
doc = false
bench = false

