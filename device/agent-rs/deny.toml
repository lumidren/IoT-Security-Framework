# cargo-deny policy for the IronMesh Rust crates (device/agent-rs; also used for
# device/esp32/host until that workspace carries its own). Run: cargo deny check
# Written by the integration lead; owners of device/agent-rs may tighten it.

[graph]
all-features = true

[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
# Unmaintained / unsound / yanked crates are reported as errors for the agent's dependency tree.
yanked = "deny"
unmaintained = "workspace"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The agent uses rustls with ring; never pull in OpenSSL bindings by accident.
deny = [
  { crate = "openssl", reason = "TLS is rustls + ring (DESIGN_CONTRACT.md section 4)" },
  { crate = "openssl-sys", reason = "TLS is rustls + ring" },
  { crate = "native-tls", reason = "TLS is rustls + ring" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
